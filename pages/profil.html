<!DOCTYPE html>
<html lang="ro">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LA CURENT | Profil</title>
<link rel="icon" type="image/png" href="../images/favicon.png?v=2">
<link rel="stylesheet" href="../css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="../js/auth.js" defer></script>
</head>

<body>
<button id="menuBtn" class="menu-btn">&#9776;</button>
<div id="sidebar"></div>

<div class="app-content">
<header>
<div class="hero-top">
<div>
<div class="small-label">LA CURENT</div>
<h1>Profil</h1>
<p>Gestionează contul folosit pentru salvarea analizelor energetice.</p>
</div>
<div class="system-state">
<span class="green-dot"></span>
Cont utilizator
</div>
</div>
</header>

<main class="dashboard">
<section class="auth-layout">
<div class="auth-panel" id="accountPanel">
<div class="small-label">CONT CURENT</div>
<h2 id="accountTitle">Nu ești autentificat</h2>
<p id="accountText">Autentifică-te ca analiza locuinței să fie legată de profilul tău.</p>
<button class="secondary-btn" id="logoutBtn" type="button" hidden>Logout</button>
</div>

<form class="auth-panel" id="loginForm">
<div class="small-label">LOGIN</div>
<h2>Intră în cont</h2>
<label>Email</label>
<input name="email" type="email" autocomplete="email" required>
<label>Parolă</label>
<input name="password" type="password" autocomplete="current-password" required>
<button class="primary-btn" type="submit">Login</button>
<a href="#" id="showForgot">Am uitat parola</a>
<p class="form-message" id="loginMessage"></p>
</form>

<form class="auth-panel" id="registerForm">
<div class="small-label">CONT NOU</div>
<h2>Creează profil</h2>
<label>Nume</label>
<input name="name" autocomplete="name" required>
<label>Email</label>
<input name="email" type="email" autocomplete="email" required>
<label>Parolă</label>
<input name="password" type="password" autocomplete="new-password" minlength="8" required>
<button class="primary-btn" type="submit">Creează cont</button>
<p class="form-message" id="registerMessage"></p>
</form>

<form class="auth-panel" id="forgotForm" hidden>
<div class="small-label">RESETARE</div>
<h2>Resetare parolă</h2>
<label>Email</label>
<input name="email" type="email" autocomplete="email" required>
<button class="primary-btn" type="submit">Generează link</button>
<p class="form-message" id="forgotMessage"></p>
<p class="form-message" id="resetLinkMessage"></p>
</form>
</section>
</main>
</div>

<script>
fetch('../components/sidebar.html')
.then(r=>r.text())
.then(x=>{
document.getElementById("sidebar").innerHTML=x;
const btn=document.getElementById("menuBtn");
if(btn){
btn.onclick=()=>document.querySelector(".sidebar").classList.toggle("open");
}
document.querySelectorAll(".sidebar-item").forEach(item=>{
item.onclick=()=>{
const menu=document.querySelector(".sidebar");
if(menu){
menu.classList.remove("open");
}
}
});
});
</script>

<script>
window.addEventListener("DOMContentLoaded",()=>{
const loginForm=document.getElementById("loginForm");
const registerForm=document.getElementById("registerForm");
const forgotForm=document.getElementById("forgotForm");
const logoutBtn=document.getElementById("logoutBtn");
const showForgot=document.getElementById("showForgot");
const accountTitle=document.getElementById("accountTitle");
const accountText=document.getElementById("accountText");

function formData(form){
return Object.fromEntries(new FormData(form).entries());
}

function setMessage(id,text,isError=false){
const el=document.getElementById(id);
el.textContent=text;
el.classList.toggle("error",isError);
}

function refreshAccount(){
const user=LaCurentAuth.currentUser();
if(user){
accountTitle.textContent=user.name;
accountText.textContent=`${user.email} este conectat. Analizele noi vor fi salvate pe acest profil.`;
logoutBtn.hidden=false;
return;
}
accountTitle.textContent="Nu ești autentificat";
accountText.textContent="Autentifică-te ca analiza locuinței să fie legată de profilul tău.";
logoutBtn.hidden=true;
}

loginForm.addEventListener("submit",async event=>{
event.preventDefault();
setMessage("loginMessage","Se autentifică...");
try{
const result=await LaCurentAuth.api("/api/login",formData(loginForm));
LaCurentAuth.saveAuth(result);
setMessage("loginMessage","Autentificat cu succes.");
refreshAccount();
}catch(error){
setMessage("loginMessage",error.message,true);
}
});

registerForm.addEventListener("submit",async event=>{
event.preventDefault();
setMessage("registerMessage","Se creează contul...");
try{
const result=await LaCurentAuth.api("/api/register",formData(registerForm));
LaCurentAuth.saveAuth(result);
setMessage("registerMessage","Cont creat și autentificat.");
refreshAccount();
}catch(error){
setMessage("registerMessage",error.message,true);
}
});

forgotForm.addEventListener("submit",async event=>{
event.preventDefault();
setMessage("forgotMessage","Se generează linkul...");
document.getElementById("resetLinkMessage").textContent="";
try{
const result=await LaCurentAuth.api("/api/forgot-password",formData(forgotForm));
setMessage("forgotMessage",result.message);
if(result.reset_url){
document.getElementById("resetLinkMessage").innerHTML=`Link temporar: <a href="${result.reset_url}">${result.reset_url}</a>`;
}
}catch(error){
setMessage("forgotMessage",error.message,true);
}
});

logoutBtn.addEventListener("click",async ()=>{
try{
await LaCurentAuth.api("/api/logout");
}catch(error){}
LaCurentAuth.clearAuth();
refreshAccount();
});

showForgot.addEventListener("click",event=>{
event.preventDefault();
forgotForm.hidden=!forgotForm.hidden;
});

refreshAccount();
});
</script>
</body>
</html>
