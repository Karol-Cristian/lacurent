<!DOCTYPE html>
<html lang="ro">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LA CURENT | Resetare parolă</title>
<link rel="icon" type="image/png" href="../images/favicon.png?v=2">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/auth.js" defer></script>
</head>

<body>
<main class="auth-page">
<form class="auth-panel reset-panel" id="resetForm">
<div class="small-label">LA CURENT</div>
<h1>Seteaza o parola noua</h1>
<label>Parolă nouă</label>
<input name="password" type="password" minlength="8" autocomplete="new-password" required>
<button class="primary-btn" type="submit">Schimbă parola</button>
<p class="form-message" id="resetMessage"></p>
<a href="profil.html">Înapoi la profil</a>
</form>
</main>

<script>
window.addEventListener("DOMContentLoaded",()=>{
const form=document.getElementById("resetForm");
const message=document.getElementById("resetMessage");
const token=new URLSearchParams(window.location.search).get("token");

form.addEventListener("submit",async event=>{
event.preventDefault();
message.textContent="Se schimbă parola...";
message.classList.remove("error");
try{
await LaCurentAuth.api("/api/reset-password",{
token,
password:new FormData(form).get("password")
});
LaCurentAuth.clearAuth();
message.textContent="Parola a fost schimbată. Te poți autentifica din nou.";
}catch(error){
message.textContent=error.message;
message.classList.add("error");
}
});
});
</script>
</body>
</html>
