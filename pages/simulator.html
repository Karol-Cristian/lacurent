<!DOCTYPE html>
<html lang="ro">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

LA CURENT | TITLU

</title>

<link
rel="icon"
type="image/png"
href="../images/favicon.png?v=2">

<link
rel="stylesheet"
href="../css/style.css">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<script
src="../js/pagina.js"
defer>
</script>

</head>

<body>


<button
id="menuBtn"
class="menu-btn">

☰

</button>


<div id="sidebar"></div>



<div class="app-content">


<header>

<div class="hero-top">

<div>

<div class="small-label">

LA CURENT

</div>

<h1>

Simulator

</h1>

<p>

Descriere scurtă

</p>

</div>


<div class="system-state">

<span class="green-dot"></span>

Activ

</div>

</div>

</header>



<main class="dashboard">

<!-- conținut pagină -->

</main>



<footer>

<small>

LA CURENT · Analiză energetică

</small>

</footer>


</div>



<script>

fetch('../components/sidebar.html')

.then(r=>r.text())

.then(x=>{

document
.getElementById(
"sidebar"
)

.innerHTML=x


const btn=

document
.getElementById(
"menuBtn"
);


if(btn){

btn.onclick=()=>{

document
.querySelector(
".sidebar"
)

.classList
.toggle(
"open"
)

}

}


document
.querySelectorAll(
".sidebar-item"
)

.forEach(item=>{

item.onclick=()=>{

const menu=

document
.querySelector(
".sidebar"
)

if(menu){

menu.classList.remove(
"open"
)

}

}

})

})

.catch(
e=>console.log(e)
)

</script>

</body>

</html>
