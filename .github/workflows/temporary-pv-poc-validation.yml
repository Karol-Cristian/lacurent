name: Temporary PV PoC validation

on:
  push:
    branches:
      - codex/product-catalog-pv-poc

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Commercial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial/requirements.txt
      - name: Validate Python and focused tests
        run: |
          git diff --check
          python -m compileall -q commercial
          python -m pytest commercial/tests/test_pv_catalog.py commercial/tests/test_product_matching.py -q
