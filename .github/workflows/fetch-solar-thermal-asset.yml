name: Fetch solar thermal GLB asset

on:
  push:
    branches:
      - codex/import-3d-solar-thermal-collector
    paths:
      - ".github/workflows/fetch-solar-thermal-asset.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download CC0 source GLB
        run: |
          mkdir -p artifact
          curl -fL --retry 3 --connect-timeout 20 \
            https://cdn.3dassets.dev/assets/2969/v1/model.glb \
            -o artifact/solar-thermal-roof-collector.glb
          test -s artifact/solar-thermal-roof-collector.glb
          python - <<'PY'
          from pathlib import Path
          p=Path("artifact/solar-thermal-roof-collector.glb")
          data=p.read_bytes()
          assert data[:4] == b"glTF", data[:16]
          print("GLB bytes", len(data))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: solar-thermal-roof-collector-glb
          path: artifact/solar-thermal-roof-collector.glb
          if-no-files-found: error
