name: Dedicated RBPE Memory Probe

on:
  push:
    branches:
      - codex/pv-orientation-regression

jobs:
  dedicated-rbpe-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: |
          python -m pip install uv "pydantic<2"

      - name: Prepare dedicated RBPE probe
        run: |
          node scripts/prepare-reference-cloudflare-worker.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path(".wrangler/reference-rbpe-worker/wrangler.toml")
          text = p.read_text()
          text = text.replace('name = "lacurent-reference-rbpe"', 'name = "lacurent-rbpe-calc-probe"')
          text = text.replace("workers_dev = false", "workers_dev = true")
          p.write_text(text)
          print(text)
          PY

      - name: Install Wrangler and sync Python dependencies
        working-directory: .wrangler/reference-rbpe-worker
        run: |
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force

      - name: Deploy dedicated RBPE probe
        working-directory: .wrangler/reference-rbpe-worker
        run: |
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler deploy

      - name: Generate canonical building payload
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "commercial")
          from app.engine import demo_building
          from app.models import model_to_dict
          with open("/tmp/rbpe-building.json","w",encoding="utf-8") as f:
              json.dump(model_to_dict(demo_building()), f)
          PY

      - name: Wait for probe health
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS https://lacurent-rbpe-calc-probe.lemnarukarol.workers.dev/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Stress dedicated RBPE serially
        env:
          RBPE_BASE_URL: https://lacurent-rbpe-calc-probe.lemnarukarol.workers.dev
          RBPE_BUILDING_FILE: /tmp/rbpe-building.json
          RBPE_CYCLES: "12"
          RBPE_DELAY_MS: "100"
        run: node scripts/stress-dedicated-rbpe.mjs

      - name: Query dedicated RBPE memory metrics
        if: always()
        run: |
          sleep 5
          python - <<'PY' > /tmp/query.json
          import json, os
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          print(json.dumps({
            "query": "query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string, $scriptName: string) { viewer { accounts(filter: {accountTag: $accountTag}) { workersInvocationsAdaptive(limit: 200, filter: {scriptName: $scriptName, datetime_geq: $datetimeStart, datetime_leq: $datetimeEnd}) { sum { requests errors } quantiles { cpuTimeP50 cpuTimeP99 memoryUsageBytesP50 memoryUsageBytesP99 } dimensions { datetime scriptName status } } } } }",
            "variables": {
              "accountTag": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "datetimeStart": (now-timedelta(minutes=15)).isoformat(timespec="milliseconds").replace("+00:00","Z"),
              "datetimeEnd": now.isoformat(timespec="milliseconds").replace("+00:00","Z"),
              "scriptName": "lacurent-rbpe-calc-probe"
            }
          }))
          PY
          curl --fail-with-body --silent \
            https://api.cloudflare.com/client/v4/graphql \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data @/tmp/query.json | jq .

      - name: Delete dedicated RBPE probe
        if: always()
        working-directory: .wrangler/reference-rbpe-worker
        run: |
          npx wrangler delete --name lacurent-rbpe-calc-probe --force || true
