name: Production sharded optimizer stability
on:
  push:
    branches:
      - diagnostic/prod-sharded-optimizer-stability
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe-prod-sharded-optimizer.py
