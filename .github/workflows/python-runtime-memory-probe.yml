name: Python Runtime Memory Probe

on:
  push:
    branches:
      - codex/pv-orientation-regression

jobs:
  runtime-memory-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install uv

      - name: Prepare isolated probe Worker
        run: |
          node scripts/prepare-commercial-cloudflare-worker.mjs \
            --name lacurent-commercial-v2-memory-probe \
            --compatibility-date 2026-09-27
          python - <<'PY'
          from pathlib import Path
          p = Path(".wrangler/commercial-v2-worker/wrangler.toml")
          text = p.read_text()
          text = text.replace(
              'compatibility_flags = ["python_workers"]',
              'compatibility_flags = ["python_workers", "enable_weak_ref"]',
          )
          # Probe must never attach production routes/custom domains.
          parts = text.split("\n[[routes]]")
          text = parts[0].rstrip() + "\n"
          p.write_text(text)
          print(text)
          PY

      - name: Install Wrangler and sync Python dependencies
        working-directory: .wrangler/commercial-v2-worker
        run: |
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force

      - name: Deploy isolated probe Worker
        working-directory: .wrangler/commercial-v2-worker
        run: |
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler deploy

      - name: Wait for probe health
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS https://lacurent-commercial-v2-memory-probe.lemnarukarol.workers.dev/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Stress modern Python runtime serially
        env:
          STRESS_BASE_URL: https://lacurent-commercial-v2-memory-probe.lemnarukarol.workers.dev
          STRESS_CYCLES: "12"
          STRESS_DELAY_MS: "150"
        run: node scripts/stress-production-pv-serial.mjs

      - name: Query probe memory metrics
        if: always()
        shell: bash
        run: |
          START="$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%S.000Z)"
          END="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          python - <<'PY' > /tmp/query.json
          import json, os
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          print(json.dumps({
            "query": "query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string, $scriptName: string) { viewer { accounts(filter: {accountTag: $accountTag}) { workersInvocationsAdaptive(limit: 200, filter: {scriptName: $scriptName, datetime_geq: $datetimeStart, datetime_leq: $datetimeEnd}) { sum { requests errors } quantiles { cpuTimeP50 cpuTimeP99 memoryUsageBytesP50 memoryUsageBytesP99 } dimensions { datetime scriptName status } } } } }",
            "variables": {
              "accountTag": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "datetimeStart": (now-timedelta(minutes=15)).isoformat(timespec="milliseconds").replace("+00:00","Z"),
              "datetimeEnd": now.isoformat(timespec="milliseconds").replace("+00:00","Z"),
              "scriptName": "lacurent-commercial-v2-memory-probe"
            }
          }))
          PY
          curl --fail-with-body --silent \
            https://api.cloudflare.com/client/v4/graphql \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data @/tmp/query.json | jq .

      - name: Delete probe Worker
        if: always()
        working-directory: .wrangler/commercial-v2-worker
        run: |
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          npx wrangler delete --name lacurent-commercial-v2-memory-probe --force || true
