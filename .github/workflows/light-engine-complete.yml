name: Light Engine Complete

on:
  workflow_dispatch:
  push:
    branches:
      - codex/light-engine-complete
    paths:
      - ".github/workflows/light-engine-complete.yml"
      - "commercial/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial/requirements.txt

      - name: Syntax checks
        run: |
          git diff --check
          python -m compileall -q commercial
          node --check commercial/static/home-lab-next.js

      - name: Run commercial tests
        run: python -m pytest commercial/tests/test_routes.py -q
