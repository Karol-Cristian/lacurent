name: Solar thermal anchor validation

on:
  push:
    branches:
      - codex/solar-thermal-anchor-right-up

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial/requirements.txt

      - name: Run route tests and JS syntax check
        run: |
          git diff --check 19cb91d69aa9873a780989a4d4db9c7232e742b3...HEAD
          node --check commercial/static/home-lab-3d.js
          python -m pytest commercial/tests/test_routes.py -q

      - name: Install Chromium smoke dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Commercial app
        run: |
          python -m uvicorn commercial.app.main:app --host 127.0.0.1 --port 8000 > /tmp/lacurent-uvicorn.log 2>&1 &
          echo $! > /tmp/lacurent-uvicorn.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/lacurent-uvicorn.pid)" 2>/dev/null; then
              cat /tmp/lacurent-uvicorn.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/lacurent-uvicorn.log
          exit 1

      - name: Run targeted Chromium geometry smoke
        env:
          HOME_LAB_BASE_URL: http://127.0.0.1:8000
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:900}});
          const errors = [];
          page.on("pageerror", e => errors.push(String(e?.stack || e)));
          await page.goto(process.env.HOME_LAB_BASE_URL + "/home-lab-next", {waitUntil:"networkidle", timeout:30000});
          await page.waitForFunction(() => Array.isArray(window.__homeLab3D) && window.__homeLab3D[0]?.modelRoot, null, {timeout:30000});
          const result = await page.evaluate(() => {
            const scene = window.__homeLab3D[0];
            scene.applyVisualState({
              ...(scene.visualState || {}),
              pvEnabled:true,
              pvKwp:20,
              solarThermalEnabled:true,
              solarThermalArea:12,
              heating:"condensing_gas_boiler",
            });
            scene.modelRoot.updateMatrixWorld(true);
            const thermal = scene.experimentLayers.get("solarThermal");
            const pv = scene.experimentLayers.get("pv");
            const smoke = scene.equipmentLayers.get("chimneySmoke");
            thermal.updateMatrixWorld(true);
            pv.updateMatrixWorld(true);
            const V = scene.modelSize.constructor;
            const R = scene.raycaster.constructor;
            const mounted = String(thermal.userData?.roofMount?.objectUuid || "");
            const pvMounted = String(pv.userData?.roofMount?.objectUuid || "");
            const panel = thermal.children.find(child => child.visible);
            const body = panel?.children.find(child => Number.isFinite(child.geometry?.parameters?.width) && Number.isFinite(child.geometry?.parameters?.depth));
            const width = body?.geometry?.parameters?.width || 0;
            const depth = body?.geometry?.parameters?.depth || 0;
            const samples = [
              [0,0],
              [-width*0.46,-depth*0.46],
              [ width*0.46,-depth*0.46],
              [-width*0.46, depth*0.46],
              [ width*0.46, depth*0.46],
            ];
            const roofMeshes = scene.inspectableMeshes.filter(mesh => mesh?.visible !== false);
            const tolerance = scene.modelSize.y * 0.035;
            const sampleHits = samples.map(([x,z]) => {
              const point = panel.localToWorld(new V(x,0,z));
              const origin = point.clone();
              origin.y += scene.modelSize.y * 0.08;
              const hits = new R(origin,new V(0,-1,0),0,scene.modelSize.y*0.18).intersectObjects(roofMeshes,true);
              const mountedHitIndex = hits.findIndex(hit => String(hit.object?.uuid || "") === mounted);
              const mountedHit = mountedHitIndex >= 0 ? hits[mountedHitIndex] : null;
              return {
                firstUuid:String(hits[0]?.object?.uuid || ""),
                firstName:String(hits[0]?.object?.name || ""),
                mountedHitIndex,
                gap:mountedHit ? Math.abs(point.y-mountedHit.point.y) : null,
              };
            });
            const pvNormal = new V(...(pv.userData?.roofMount?.worldNormal || [0,1,0])).normalize();
            const thermalNormal = new V(...(thermal.userData?.roofMount?.worldNormal || [0,1,0])).normalize();
            const smokeWorld = scene.modelRoot.localToWorld(smoke.position.clone()).toArray();
            return {
              fallback:Boolean(thermal.userData?.roofMountFallback),
              thermalVisible:Boolean(thermal.visible),
              thermalVisibleChildren:thermal.children.filter(child=>child.visible).length,
              thermalAnchor:thermal.userData?.roofMount?.anchor,
              thermalMountedUuid:mounted,
              thermalMountedMesh:String(thermal.userData?.roofMount?.mesh || ""),
              pvVisible:Boolean(pv.visible),
              pvVisibleChildren:pv.children.filter(child=>child.visible).length,
              pvAnchor:pv.userData?.roofMount?.anchor,
              pvMountedUuid:pvMounted,
              roofNormalDot:pvNormal.dot(thermalNormal),
              sampleHits,
              supportTolerance:tolerance,
              smokeVisible:Boolean(smoke.visible),
              smokeWorld,
            };
          });
          console.log(JSON.stringify(result, null, 2));
          if (errors.length) throw new Error("Page errors: " + JSON.stringify(errors));
          if (!result.thermalVisible || result.thermalVisibleChildren !== 1) throw new Error("Solar thermal must expose exactly one visible collector");
          if (result.fallback) throw new Error("Solar thermal used roof mount fallback");
          if (JSON.stringify(result.thermalAnchor) !== JSON.stringify([-0.18,0.78,0.08])) throw new Error("Unexpected solar thermal anchor");
          if (!result.thermalMountedUuid || result.thermalMountedUuid !== result.pvMountedUuid) throw new Error("Solar thermal is not mounted to the main PV roof mesh");
          if (result.sampleHits.some(hit => hit.mountedHitIndex !== 0 || hit.firstUuid !== result.thermalMountedUuid || hit.gap === null || hit.gap > result.supportTolerance)) {
            throw new Error("Solar thermal corners are unsupported or intercepted before main roof (possible skylight overlap): " + JSON.stringify(result.sampleHits));
          }
          if (result.roofNormalDot < 0.995) throw new Error("Solar thermal is not flush with main roof plane");
          if (!result.pvVisible || result.pvVisibleChildren !== 8) throw new Error("PV layout/visibility changed");
          if (JSON.stringify(result.pvAnchor) !== JSON.stringify([-0.34,0.72,0.16])) throw new Error("PV anchor changed");
          if (!result.smokeVisible) throw new Error("Smoke unexpectedly hidden");
          const [sx,sy,sz]=result.smokeWorld;
          if (Math.abs(sx-0.80)>0.30 || Math.abs(sz-0.40)>0.30 || sy<4.85) throw new Error("Smoke/chimney runtime position changed unexpectedly");
          await browser.close();
          NODE
