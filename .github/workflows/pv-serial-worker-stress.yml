name: PV Serial Worker Stress

on:
  push:
    branches:
      - codex/pv-orientation-regression

jobs:
  serial-pv-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run serial PV recalculation stress against workers.dev
        env:
          STRESS_BASE_URL: https://lacurent-commercial-v2.lemnarukarol.workers.dev
          STRESS_CYCLES: "6"
          STRESS_DELAY_MS: "150"
        run: node scripts/stress-production-pv-serial.mjs
