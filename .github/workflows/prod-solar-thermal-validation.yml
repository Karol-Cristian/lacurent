name: Production solar thermal GLB validation

on:
  push:
    branches:
      - codex/import-3d-solar-thermal-collector
    paths:
      - ".github/workflows/prod-solar-thermal-validation.yml"

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate live Home Lab solar thermal collector
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const url = "https://lacurent.com/home-lab-next";
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:1000}, deviceScaleFactor:1});
          const pageErrors = [];
          const consoleErrors = [];
          page.on("pageerror", error => pageErrors.push(String(error?.stack || error)));
          page.on("console", message => {
            if (message.type() === "error") consoleErrors.push(message.text());
          });

          await page.goto(url, {waitUntil:"networkidle", timeout:45000});

          const scriptSrc = await page.locator('script[src*="home-lab-3d.js"]').getAttribute("src");
          if (scriptSrc !== "/static/home-lab-3d.js?v=3d45") {
            throw new Error("Production cache key mismatch: " + scriptSrc);
          }

          await page.waitForFunction(
            () => Array.isArray(window.__homeLab3D) && window.__homeLab3D[0]?.modelRoot,
            null,
            {timeout:45000}
          );

          await page.waitForFunction(
            () => {
              const scene = window.__homeLab3D?.[0];
              const thermal = scene?.experimentLayers?.get?.("solarThermal");
              return Boolean(thermal?.userData?.assetLoaded) && !thermal?.userData?.assetFallback;
            },
            null,
            {timeout:45000}
          );

          const result = await page.evaluate(() => {
            const scene = window.__homeLab3D[0];
            scene.applyVisualState({
              ...(scene.visualState || {}),
              pvEnabled:true,
              pvKwp:20,
              solarThermalEnabled:true,
              solarThermalArea:12,
              heating:"condensing_gas_boiler",
            });

            scene.modelRoot.updateMatrixWorld(true);

            const thermal = scene.experimentLayers.get("solarThermal");
            const pv = scene.experimentLayers.get("pv");
            const smoke = scene.equipmentLayers.get("chimneySmoke");
            thermal.updateMatrixWorld(true);
            pv.updateMatrixWorld(true);

            const V = scene.modelSize.constructor;
            const R = scene.raycaster.constructor;

            const thermalMountedUuid = String(thermal.userData?.roofMount?.objectUuid || "");
            const pvMountedUuid = String(pv.userData?.roofMount?.objectUuid || "");
            const collector = thermal.children.find(child => child.visible);
            const probe = collector?.children.find(child => child.name === "SolarThermalCollector_supportProbe");
            const width = probe?.geometry?.parameters?.width || 0;
            const depth = probe?.geometry?.parameters?.depth || 0;

            const roofMeshes = scene.inspectableMeshes.filter(mesh => mesh?.visible !== false);
            const tolerance = scene.modelSize.y * 0.035;
            const samples = [
              [0,0],
              [-width*0.46,-depth*0.46],
              [ width*0.46,-depth*0.46],
              [-width*0.46, depth*0.46],
              [ width*0.46, depth*0.46],
            ];

            const support = samples.map(([x,z]) => {
              const point = collector.localToWorld(new V(x,0,z));
              const origin = point.clone();
              origin.y += scene.modelSize.y * 0.08;
              const hits = new R(origin,new V(0,-1,0),0,scene.modelSize.y*0.18)
                .intersectObjects(roofMeshes,true);
              const mainIndex = hits.findIndex(hit => String(hit.object?.uuid || "") === thermalMountedUuid);
              const mainHit = mainIndex >= 0 ? hits[mainIndex] : null;
              return {
                firstUuid:String(hits[0]?.object?.uuid || ""),
                firstName:String(hits[0]?.object?.name || ""),
                mainIndex,
                gap:mainHit ? Math.abs(point.y - mainHit.point.y) : null,
              };
            });

            const pvNormal = new V(...(pv.userData?.roofMount?.worldNormal || [0,1,0])).normalize();
            const thermalNormal = new V(...(thermal.userData?.roofMount?.worldNormal || [0,1,0])).normalize();
            const smokeWorld = scene.modelRoot.localToWorld(smoke.position.clone()).toArray();

            const imported = collector?.getObjectByName?.("SolarThermalCollector_importedGLB");
            const glass = collector?.getObjectByName?.("SolarThermalCollector_lowIronGlass");
            const absorber = collector?.getObjectByName?.("SolarThermalCollector_absorber");

            return {
              assetLoaded:Boolean(thermal.userData?.assetLoaded),
              assetFallback:Boolean(thermal.userData?.assetFallback),
              assetUrl:String(thermal.userData?.assetUrl || ""),
              anchor:thermal.userData?.roofMount?.anchor || null,
              mountedMesh:String(thermal.userData?.roofMount?.mesh || ""),
              thermalMountedUuid,
              pvMountedUuid,
              thermalVisible:Boolean(thermal.visible),
              thermalVisibleChildren:thermal.children.filter(child => child.visible).length,
              importedPresent:Boolean(imported),
              glassPresent:Boolean(glass),
              absorberPresent:Boolean(absorber),
              support,
              supportTolerance:tolerance,
              roofNormalDot:pvNormal.dot(thermalNormal),
              pvVisible:Boolean(pv.visible),
              pvVisibleChildren:pv.children.filter(child => child.visible).length,
              pvAnchor:pv.userData?.roofMount?.anchor || null,
              smokeVisible:Boolean(smoke.visible),
              smokeWorld,
            };
          });

          console.log(JSON.stringify({scriptSrc, result, pageErrors, consoleErrors}, null, 2));

          if (pageErrors.length) throw new Error("Production page errors: " + JSON.stringify(pageErrors));
          if (!result.assetLoaded || result.assetFallback) throw new Error("Imported GLB is not active in production");
          if (result.assetUrl !== "https://cdn.3dassets.dev/assets/2969/v1/model.glb") throw new Error("Unexpected GLB URL");
          if (JSON.stringify(result.anchor) !== JSON.stringify([-0.18,0.78,0.08])) throw new Error("Thermal anchor changed");
          if (!result.thermalVisible || result.thermalVisibleChildren !== 1) throw new Error("Thermal collector count/visibility invalid");
          if (!result.importedPresent || !result.glassPresent || !result.absorberPresent) throw new Error("Imported collector visual layers missing");
          if (!result.thermalMountedUuid || result.thermalMountedUuid !== result.pvMountedUuid) throw new Error("Thermal collector not mounted on main roof mesh");
          if (result.support.some(hit => hit.firstUuid !== result.thermalMountedUuid || hit.mainIndex !== 0 || hit.gap === null || hit.gap > result.supportTolerance)) {
            throw new Error("Thermal collector unsupported or intercepted by skylight: " + JSON.stringify(result.support));
          }
          if (result.roofNormalDot < 0.995) throw new Error("Thermal collector is not flush to roof plane");
          if (!result.pvVisible || result.pvVisibleChildren !== 8) throw new Error("PV layout changed");
          if (JSON.stringify(result.pvAnchor) !== JSON.stringify([-0.34,0.72,0.16])) throw new Error("PV anchor changed");
          if (!result.smokeVisible) throw new Error("Smoke is hidden unexpectedly");
          const [sx,sy,sz] = result.smokeWorld;
          if (Math.abs(sx-0.80)>0.30 || Math.abs(sz-0.40)>0.30 || sy<4.85) throw new Error("Smoke/chimney position changed");

          await page.screenshot({path:"artifacts/home-lab-solar-thermal-production.png", fullPage:true});
          await browser.close();
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: home-lab-solar-thermal-production
          path: artifacts/home-lab-solar-thermal-production.png
          if-no-files-found: error
