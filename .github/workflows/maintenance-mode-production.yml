name: Production Maintenance Mode

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Maintenance control action"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - enable
          - disable

concurrency:
  group: lacurent-production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACTION: ${{ inputs.action }}
      PRODUCTION_BRANCH: codex/commercial-v2-cloudflare-python
      MAINTENANCE_URL: https://lacurent-maintenance.lemnarukarol.workers.dev

    steps:
      - name: Refuse production mutation outside production branch
        if: inputs.action != 'status'
        run: |
          if [ "$GITHUB_REF_NAME" != "$PRODUCTION_BRANCH" ]; then
            echo "::error::Maintenance enable/disable must run from $PRODUCTION_BRANCH."
            exit 1
          fi

      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate maintenance implementation
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --check commercial/maintenance-worker/worker.mjs
          node --check scripts/cloudflare-maintenance-mode.mjs
          node --test commercial/tests/maintenance-worker.test.mjs
          node --test commercial/tests/maintenance-route-switch.test.mjs

      - name: Deploy production maintenance Worker without routes
        if: inputs.action == 'enable'
        working-directory: commercial/maintenance-worker
        run: |
          npm install --no-save wrangler@latest
          npx wrangler deploy

      - name: Verify route-less maintenance Worker readiness
        if: inputs.action == 'enable'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const url = process.env.MAINTENANCE_URL + "/__maintenance/health";
          let last = null;
          for (let attempt = 1; attempt <= 30; attempt++) {
            try {
              const response = await fetch(url, {headers:{"cache-control":"no-cache"}});
              if (response.status === 200) {
                const body = await response.json();
                if (body.status === "ready" && body.mode === "maintenance") {
                  console.log("Maintenance Worker ready", body);
                  process.exit(0);
                }
              }
              last = new Error("readiness HTTP " + response.status);
            } catch (error) {
              last = error;
            }
            await new Promise(resolve => setTimeout(resolve, Math.min(attempt, 5) * 1000));
          }
          throw last || new Error("Maintenance Worker readiness failed");
          NODE

      - name: Inspect current maintenance routing
        if: inputs.action == 'status'
        run: node scripts/cloudflare-maintenance-mode.mjs status

      - name: Enable maintenance routing
        if: inputs.action == 'enable'
        env:
          MAINTENANCE_CONFIRM: lacurent.com
        run: node scripts/cloudflare-maintenance-mode.mjs enable

      - name: Verify public maintenance mode
        if: inputs.action == 'enable'
        run: |
          set -euo pipefail
          node - <<'NODE'
          async function expect(url, status) {
            let last = null;
            for (let attempt = 1; attempt <= 20; attempt++) {
              try {
                const response = await fetch(url, {
                  redirect:"manual",
                  headers:{"cache-control":"no-cache"},
                });
                const text = await response.text();
                if (
                  response.status === status
                  && response.headers.get("x-lacurent-maintenance") === "1"
                ) return {response, text};
                last = new Error(url + " -> " + response.status);
              } catch (error) {
                last = error;
              }
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            throw last || new Error("maintenance verification failed");
          }

          const page = await expect("https://lacurent.com/", 503);
          if (!page.text.includes("Actualizăm LaCurent.")) {
            throw new Error("Public maintenance page copy missing.");
          }
          const api = await expect(
            "https://lacurent.com/api/home-lab-next/calculate",
            503,
          );
          const payload = JSON.parse(api.text);
          if (payload.maintenance !== true) {
            throw new Error("Public API maintenance contract missing.");
          }
          console.log("Public maintenance mode PASS");
          NODE

      - name: Disable maintenance routing
        if: inputs.action == 'disable'
        env:
          MAINTENANCE_CONFIRM: lacurent.com
        run: node scripts/cloudflare-maintenance-mode.mjs disable

      - name: Verify production recovered after maintenance
        if: inputs.action == 'disable'
        run: |
          set -euo pipefail
          node - <<'NODE'
          let last = null;
          for (let attempt = 1; attempt <= 30; attempt++) {
            try {
              const response = await fetch("https://lacurent.com/health", {
                headers:{"cache-control":"no-cache"},
              });
              const text = await response.text();
              if (
                response.status === 200
                && response.headers.get("x-lacurent-maintenance") !== "1"
                && text.includes('"status":"ok"')
              ) {
                console.log("Production health restored.");
                process.exit(0);
              }
              last = new Error("production health HTTP " + response.status + ": " + text.slice(0,200));
            } catch (error) {
              last = error;
            }
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          throw last || new Error("Production did not recover after maintenance disable.");
          NODE

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production maintenance control"
            echo
            echo "- action: `$ACTION`"
            echo "- ref: `$GITHUB_REF_NAME`"
            echo "- production route mutation is allowed only from `$PRODUCTION_BRANCH`"
            echo "- maintenance Worker stays independently deployable from the main application"
          } >> "$GITHUB_STEP_SUMMARY"
