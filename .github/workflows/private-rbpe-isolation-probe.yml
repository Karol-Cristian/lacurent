name: Private RBPE Isolation Probe

on:
  push:
    branches:
      - codex/private-rbpe-live-calculation

jobs:
  private-rbpe-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install probe dependencies
        run: |
          python -m pip install uv
          python -m pip install -r commercial/requirements.txt

      - name: Prepare canonical building payload
        run: |
          python - <<'PY' > /tmp/building.json
          from commercial.app.main import build_input_from_form
          from commercial.app.models import model_to_json

          form = {
              "project_name": "Private RBPE stress",
              "locality_id": "@lc2|alba_iulia|III|-18|siruta-stress|Stress%20Locality|Alba",
              "locality": "Stress Locality",
              "heated_floor_area_m2": "160",
              "heated_volume_m3": "432",
              "indoor_design_temperature_c": "20",
              "building_type": "residential_individual",
              "construction_year": "2004",
              "wall_area_m2": "168",
              "wall_u_value": "0.42",
              "roof_area_m2": "92",
              "roof_u_value": "0.24",
              "floor_area_m2": "80",
              "floor_u_value": "0.36",
              "floor_boundary_type": "ground",
              "ground_exposed_perimeter_m": "36",
              "ground_wall_thickness_m": "0.30",
              "ground_conductivity_w_mk": "2.0",
              "window_area_m2": "24",
              "window_u_value": "1.35",
              "door_area_m2": "3.2",
              "door_u_value": "1.7",
              "thermal_bridge_length_m": "42",
              "thermal_bridge_psi_w_mk": "0.05",
              "air_changes_per_hour": "0.5",
              "infiltration_air_changes_per_hour": "0.15",
              "heat_recovery_efficiency": "0",
              "heating_system_type": "condensing_gas_boiler",
              "heating_efficiency": "0.94",
              "heating_carrier": "natural_gas",
              "dhw_enabled": "on",
              "dhw_occupants": "4",
              "dhw_litres_per_person_day_at_60c": "50",
              "dhw_efficiency": "0.86",
              "dhw_carrier": "natural_gas",
              "pv_enabled": "on",
              "pv_installed_power_kwp": "5",
              "pv_orientation": "south",
              "pv_tilt_degrees": "30",
              "pv_performance_ratio": "0.82",
          }
          print(model_to_json(build_input_from_form(form)))
          PY

      - name: Prepare and deploy private RBPE probe
        run: |
          node scripts/prepare-reference-cloudflare-worker.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path(".wrangler/reference-rbpe-worker/wrangler.toml")
          text = p.read_text().replace(
              'name = "lacurent-reference-rbpe"',
              'name = "lacurent-rbpe-live-probe"',
          )
          p.write_text(text)
          PY
          cd .wrangler/reference-rbpe-worker
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force
          uvx --from workers-py pywrangler deploy

      - name: Prepare minimal Python proxy bound to private RBPE
        run: |
          mkdir -p .wrangler/rbpe-proxy-probe
          cat > .wrangler/rbpe-proxy-probe/worker.py <<'PY'
          import json
          from workers import Response, WorkerEntrypoint

          class Default(WorkerEntrypoint):
              async def fetch(self, request):
                  payload = await request.text()
                  result = await self.env.RBPE.calculate_home_lab(payload)
                  if hasattr(result, "to_py"):
                      result = result.to_py()
                  if not isinstance(result, dict):
                      result = dict(result)
                  return Response(
                      json.dumps({
                          "energy_class": result.get("energy_class"),
                          "final_energy_kwh": result.get("total_final_energy_kwh"),
                      }),
                      headers={"content-type": "application/json"},
                  )
          PY
          cat > .wrangler/rbpe-proxy-probe/pyproject.toml <<'TOML'
          [project]
          name = "lacurent-rbpe-proxy-probe"
          version = "0.1.0"
          requires-python = ">=3.13"
          dependencies = []

          [dependency-groups]
          dev = ["workers-py", "workers-runtime-sdk"]

          [tool.pywrangler]
          allow-build = false
          TOML
          cat > .wrangler/rbpe-proxy-probe/wrangler.toml <<'TOML'
          name = "lacurent-rbpe-proxy-probe"
          main = "worker.py"
          compatibility_date = "2026-09-27"
          compatibility_flags = ["python_workers", "enable_weak_ref"]
          workers_dev = true

          [[services]]
          binding = "RBPE"
          service = "lacurent-rbpe-live-probe"
          remote = true
          TOML
          cd .wrangler/rbpe-proxy-probe
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force
          uvx --from workers-py pywrangler deploy

      - name: Wait for proxy
        run: |
          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              --data-binary @/tmp/building.json \
              https://lacurent-rbpe-proxy-probe.lemnarukarol.workers.dev/ || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run 96 serial private RBPE calls
        run: |
          node <<'JS'
          const fs = await import("node:fs");
          const url = "https://lacurent-rbpe-proxy-probe.lemnarukarol.workers.dev/";
          const payload = fs.readFileSync("/tmp/building.json", "utf8").trim();
          for (let i = 0; i < 96; i++) {
            const started = performance.now();
            const response = await fetch(url, {method:"POST", body:payload});
            const raw = await response.text();
            let body = null;
            try { body = JSON.parse(raw); } catch (_) {}
            console.log(JSON.stringify({
              count:i+1,
              status:response.status,
              elapsed_ms:Math.round(performance.now()-started),
              energy_class:body?.energy_class ?? null,
              final_energy_kwh:body?.final_energy_kwh ?? null
            }));
            if (!response.ok || !body?.energy_class || body?.final_energy_kwh == null) {
              console.error(raw.slice(0,1500));
              process.exit(1);
            }
            await new Promise(resolve => setTimeout(resolve, 100));
          }
          JS

      - name: Allow analytics to settle
        if: always()
        run: sleep 25

      - name: Query probe memory
        if: always()
        run: |
          python - <<'PY' > /tmp/query.json
          import json, os
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          query = """query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string) {
            viewer { accounts(filter: {accountTag: $accountTag}) {
              workersInvocationsAdaptive(limit: 500, filter: {
                datetime_geq: $datetimeStart,
                datetime_leq: $datetimeEnd
              }) {
                sum { requests errors }
                quantiles { cpuTimeP50 cpuTimeP99 memoryUsageBytesP50 memoryUsageBytesP99 }
                dimensions { datetime scriptName status }
              }
            } }
          }"""
          print(json.dumps({
            "query": query,
            "variables": {
              "accountTag": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "datetimeStart": (now-timedelta(minutes=15)).isoformat(timespec="milliseconds").replace("+00:00","Z"),
              "datetimeEnd": now.isoformat(timespec="milliseconds").replace("+00:00","Z")
            }
          }))
          PY
          curl --fail-with-body --silent https://api.cloudflare.com/client/v4/graphql \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data @/tmp/query.json \
            | jq '.data.viewer.accounts[0].workersInvocationsAdaptive
              | map(select(.dimensions.scriptName == "lacurent-rbpe-proxy-probe"
                        or .dimensions.scriptName == "lacurent-rbpe-live-probe"))'

      - name: Delete probe Workers
        if: always()
        run: |
          cd .wrangler/rbpe-proxy-probe
          npx wrangler delete --name lacurent-rbpe-proxy-probe --force || true
          cd ../reference-rbpe-worker
          npx wrangler delete --name lacurent-rbpe-live-probe --force || true
