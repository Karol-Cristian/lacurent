name: Private RBPE Isolation Probe

on:
  push:
    branches:
      - codex/private-rbpe-live-calculation

jobs:
  private-rbpe-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install probe dependencies
        run: |
          python -m pip install uv
          python -m pip install -r commercial/requirements.txt

      - name: Prepare canonical building payload
        run: |
          python - <<'PY' > /tmp/building.json
          from commercial.app.main import build_input_from_form
          from commercial.app.models import model_to_json
          form = {
              "project_name":"Private RBPE stress",
              "locality_id":"@lc2|alba_iulia|III|-18|siruta-stress|Stress%20Locality|Alba",
              "locality":"Stress Locality",
              "heated_floor_area_m2":"160","heated_volume_m3":"432",
              "indoor_design_temperature_c":"20","building_type":"residential_individual",
              "construction_year":"2004","wall_area_m2":"168","wall_u_value":"0.42",
              "roof_area_m2":"92","roof_u_value":"0.24","floor_area_m2":"80",
              "floor_u_value":"0.36","floor_boundary_type":"ground",
              "ground_exposed_perimeter_m":"36","ground_wall_thickness_m":"0.30",
              "ground_conductivity_w_mk":"2.0","window_area_m2":"24",
              "window_u_value":"1.35","door_area_m2":"3.2","door_u_value":"1.7",
              "thermal_bridge_length_m":"42","thermal_bridge_psi_w_mk":"0.05",
              "air_changes_per_hour":"0.5","infiltration_air_changes_per_hour":"0.15",
              "heat_recovery_efficiency":"0","heating_system_type":"condensing_gas_boiler",
              "heating_efficiency":"0.94","heating_carrier":"natural_gas",
              "dhw_enabled":"on","dhw_occupants":"4",
              "dhw_litres_per_person_day_at_60c":"50","dhw_efficiency":"0.86",
              "dhw_carrier":"natural_gas","pv_enabled":"on",
              "pv_installed_power_kwp":"5","pv_orientation":"south",
              "pv_tilt_degrees":"30","pv_performance_ratio":"0.82",
          }
          print(model_to_json(build_input_from_form(form)))
          PY

      - name: Deploy private RBPE service probe
        run: |
          node scripts/prepare-reference-cloudflare-worker.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path(".wrangler/reference-rbpe-worker/wrangler.toml")
          p.write_text(p.read_text().replace(
              'name = "lacurent-reference-rbpe"',
              'name = "lacurent-rbpe-live-probe"',
          ))
          PY
          cd .wrangler/reference-rbpe-worker
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force
          uvx --from workers-py pywrangler deploy
          sleep 15

      - name: Deploy minimal retry proxy
        run: |
          mkdir -p .wrangler/rbpe-retry-proxy
          cat > .wrangler/rbpe-retry-proxy/worker.py <<'PY'
          import asyncio
          import json
          from workers import Response, WorkerEntrypoint

          class Default(WorkerEntrypoint):
              async def fetch(self, request):
                  payload = await request.text()
                  last_error = None
                  for attempt in range(2):
                      try:
                          result_json = await self.env.RBPE.calculate_home_lab_json(payload)
                          return Response(
                              str(result_json),
                              headers={
                                  "content-type":"application/json",
                                  "x-rbpe-attempt":str(attempt + 1),
                              },
                          )
                      except Exception as exc:
                          last_error = exc
                          if attempt == 0:
                              await asyncio.sleep(0.05)
                  return Response(
                      json.dumps({
                          "error":"private RBPE unavailable after recycle retry",
                          "errorType":type(last_error).__name__ if last_error else "unknown",
                      }),
                      status=503,
                      headers={"content-type":"application/json","x-rbpe-attempt":"2"},
                  )
          PY
          cat > .wrangler/rbpe-retry-proxy/pyproject.toml <<'TOML'
          [project]
          name = "lacurent-rbpe-retry-proxy"
          version = "0.1.0"
          requires-python = ">=3.13"
          dependencies = []

          [dependency-groups]
          dev = ["workers-py", "workers-runtime-sdk"]

          [tool.pywrangler]
          allow-build = false
          TOML
          cat > .wrangler/rbpe-retry-proxy/wrangler.toml <<'TOML'
          name = "lacurent-rbpe-retry-proxy"
          main = "worker.py"
          compatibility_date = "2026-09-27"
          compatibility_flags = ["python_workers", "enable_weak_ref"]
          workers_dev = true

          [[services]]
          binding = "RBPE"
          service = "lacurent-rbpe-live-probe"
          remote = true
          TOML
          cd .wrangler/rbpe-retry-proxy
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force
          uvx --from workers-py pywrangler deploy
          sleep 15

      - name: Wait for retry proxy
        run: |
          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /tmp/probe.json -w '%{http_code}' -X POST \
              --data-binary @/tmp/building.json \
              https://lacurent-rbpe-retry-proxy.lemnarukarol.workers.dev/ || true)"
            if [ "$status" = "200" ]; then
              cat /tmp/probe.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/probe.json || true
          exit 1

      - name: Run 240 serial calls through recycle retry
        run: |
          node <<'JS'
          const fs = await import("node:fs");
          const payload = fs.readFileSync("/tmp/building.json", "utf8").trim();
          const url = "https://lacurent-rbpe-retry-proxy.lemnarukarol.workers.dev/";
          let retries = 0;
          for (let i = 0; i < 240; i++) {
            const started = performance.now();
            const response = await fetch(url, {method:"POST", body:payload});
            const raw = await response.text();
            let body = null;
            try { body = JSON.parse(raw); } catch (_) {}
            const attempt = Number(response.headers.get("x-rbpe-attempt") || "0");
            if (attempt > 1) retries += 1;
            console.log(JSON.stringify({
              count:i+1,status:response.status,attempt,
              elapsed_ms:Math.round(performance.now()-started),
              energy_class:body?.energy_class ?? null,
              final_energy_kwh:body?.total_final_energy_kwh ?? null
            }));
            if (!response.ok || !body?.energy_class || body?.total_final_energy_kwh == null) {
              console.error(raw.slice(0,1500));
              process.exit(1);
            }
            await new Promise(resolve => setTimeout(resolve, 75));
          }
          console.log(JSON.stringify({status:"stress-complete",requests:240,recycle_retries:retries}));
          JS

      - name: Delete probe Workers
        if: always()
        run: |
          cd .wrangler/rbpe-retry-proxy
          npx wrangler delete --name lacurent-rbpe-retry-proxy --force || true
          cd ../reference-rbpe-worker
          npx wrangler delete --name lacurent-rbpe-live-probe --force || true
