name: Private RBPE Isolation Probe

on:
  push:
    branches:
      - codex/private-rbpe-live-calculation

jobs:
  private-rbpe-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install uv

      - name: Prepare and deploy private RBPE probe
        run: |
          node scripts/prepare-reference-cloudflare-worker.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path(".wrangler/reference-rbpe-worker/wrangler.toml")
          text = p.read_text().replace(
              'name = "lacurent-reference-rbpe"',
              'name = "lacurent-rbpe-live-probe"',
          )
          p.write_text(text)
          PY
          cd .wrangler/reference-rbpe-worker
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force
          uvx --from workers-py pywrangler deploy

      - name: Prepare and deploy web probe bound to private RBPE
        run: |
          node scripts/prepare-commercial-cloudflare-worker.mjs --name lacurent-commercial-v2-rbpe-probe
          python - <<'PY'
          from pathlib import Path
          p = Path(".wrangler/commercial-v2-worker/wrangler.toml")
          text = p.read_text()
          text = text.replace(
              'service = "lacurent-reference-rbpe"',
              'service = "lacurent-rbpe-live-probe"',
          )
          # Probe is workers.dev only; never attach production domains. Keep
          # the text-module rules because FastAPI mounts static/templates from
          # the packaged Python filesystem at import time.
          before_routes = text.split("\n[[routes]]", 1)[0].rstrip()
          rules = "\n[[rules]]" + text.split("\n[[rules]]", 1)[1]
          text = before_routes + "\n" + rules.lstrip("\n")
          p.write_text(text)
          print(text)
          PY
          cd .wrangler/commercial-v2-worker
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force
          uvx --from workers-py pywrangler deploy

      - name: Wait for web probe
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS https://lacurent-commercial-v2-rbpe-probe.lemnarukarol.workers.dev/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run 96 serial live RBPE recalculations
        run: |
          node <<'JS'
          const baseUrl = "https://lacurent-commercial-v2-rbpe-probe.lemnarukarol.workers.dev";
          const orientations = ["south","south_west","west","north_west","north","north_east","east","south_east"];
          const base = {
            project_name:"Private RBPE stress",
            locality_id:"@lc2|alba_iulia|III|-18|siruta-stress|Stress%20Locality|Alba",
            locality:"Stress Locality",
            heated_floor_area_m2:"160",
            heated_volume_m3:"432",
            indoor_design_temperature_c:"20",
            building_type:"residential_individual",
            construction_year:"2004",
            wall_area_m2:"168",
            wall_u_value:"0.42",
            roof_area_m2:"92",
            roof_u_value:"0.24",
            floor_area_m2:"80",
            floor_u_value:"0.36",
            floor_boundary_type:"ground",
            ground_exposed_perimeter_m:"36",
            ground_wall_thickness_m:"0.30",
            ground_conductivity_w_mk:"2.0",
            window_area_m2:"24",
            window_u_value:"1.35",
            door_area_m2:"3.2",
            door_u_value:"1.7",
            thermal_bridge_length_m:"42",
            thermal_bridge_psi_w_mk:"0.05",
            air_changes_per_hour:"0.5",
            infiltration_air_changes_per_hour:"0.15",
            heat_recovery_efficiency:"0",
            heating_system_type:"condensing_gas_boiler",
            heating_efficiency:"0.94",
            heating_carrier:"natural_gas",
            dhw_enabled:"on",
            dhw_occupants:"4",
            dhw_litres_per_person_day_at_60c:"50",
            dhw_efficiency:"0.86",
            dhw_carrier:"natural_gas",
            pv_enabled:"on",
            pv_installed_power_kwp:"5",
            pv_tilt_degrees:"30",
            pv_performance_ratio:"0.82"
          };

          for (let i = 0; i < 96; i++) {
            const orientation = orientations[i % orientations.length];
            const body = new URLSearchParams({...base, pv_orientation:orientation});
            const started = performance.now();
            const response = await fetch(baseUrl + "/api/home-lab-next/calculate", {
              method:"POST",
              headers:{"Accept":"application/json","Content-Type":"application/x-www-form-urlencoded"},
              body
            });
            const raw = await response.text();
            let payload = null;
            try { payload = JSON.parse(raw); } catch (_) {}
            console.log(JSON.stringify({
              count:i+1,
              orientation,
              status:response.status,
              elapsed_ms:Math.round(performance.now()-started),
              energy_class:payload?.energy_class ?? null,
              annual_cost_lei:payload?.annual_cost_lei ?? null
            }));
            if (!response.ok || !payload?.energy_class || payload?.annual_cost_lei == null) {
              console.error(raw.slice(0,1500));
              process.exit(1);
            }
            await new Promise(resolve => setTimeout(resolve, 100));
          }

          for (const path of ["/health", "/home-lab-next"]) {
            const response = await fetch(baseUrl + path);
            console.log(path, response.status);
            if (!response.ok) process.exit(2);
          }
          JS

      - name: Query probe memory
        if: always()
        run: |
          python - <<'PY' > /tmp/query.json
          import json, os
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          query = """query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string) {
            viewer { accounts(filter: {accountTag: $accountTag}) {
              workersInvocationsAdaptive(limit: 500, filter: {
                datetime_geq: $datetimeStart,
                datetime_leq: $datetimeEnd
              }) {
                sum { requests errors }
                quantiles { cpuTimeP50 cpuTimeP99 memoryUsageBytesP50 memoryUsageBytesP99 }
                dimensions { datetime scriptName status }
              }
            } }
          }"""
          print(json.dumps({
            "query": query,
            "variables": {
              "accountTag": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "datetimeStart": (now-timedelta(minutes=15)).isoformat(timespec="milliseconds").replace("+00:00","Z"),
              "datetimeEnd": now.isoformat(timespec="milliseconds").replace("+00:00","Z")
            }
          }))
          PY
          curl --fail-with-body --silent https://api.cloudflare.com/client/v4/graphql \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data @/tmp/query.json \
            | jq '.data.viewer.accounts[0].workersInvocationsAdaptive
              | map(select(.dimensions.scriptName == "lacurent-commercial-v2-rbpe-probe"
                        or .dimensions.scriptName == "lacurent-rbpe-live-probe"))'

      - name: Delete probe Workers
        if: always()
        run: |
          cd .wrangler/commercial-v2-worker
          npx wrangler delete --name lacurent-commercial-v2-rbpe-probe --force || true
          cd ../reference-rbpe-worker
          npx wrangler delete --name lacurent-rbpe-live-probe --force || true
