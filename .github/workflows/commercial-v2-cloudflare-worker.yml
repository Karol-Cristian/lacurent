name: Commercial v2 Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - codex/commercial-v2-cloudflare-python
    paths:
      - ".github/workflows/commercial-v2-cloudflare-worker.yml"
      - "commercial/**"
      - "scripts/prepare-commercial-cloudflare-worker.mjs"

jobs:
  worker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install local Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial/requirements.txt

      - name: Run normal Commercial v2 checks
        run: |
          git diff --check
          node --check commercial/static/app.js
          python -m compileall -q commercial
          python -m pytest commercial/tests -q

      - name: Install uv
        run: python -m pip install uv

      - name: Prepare Cloudflare Worker bundle
        run: node scripts/prepare-commercial-cloudflare-worker.mjs

      - name: Install current Wrangler
        working-directory: .wrangler/commercial-v2-worker
        run: |
          npm install --save-dev wrangler@latest
          npx wrangler --version

      - name: Sync Python Worker dependencies
        working-directory: .wrangler/commercial-v2-worker
        run: |
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          wrangler --version
          uvx --from workers-py pywrangler --version
          uvx --from workers-py pywrangler sync --force

      - name: Prove real Worker runtime
        working-directory: .wrangler/commercial-v2-worker
        run: |
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler dev --ip 127.0.0.1 --port 8788 > worker-dev.log 2>&1 &
          echo "$!" > worker-dev.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8788/health; then
              break
            fi
            if ! kill -0 "$(cat worker-dev.pid)" 2>/dev/null; then
              cat worker-dev.log
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8788/health

      - name: Smoke-test Worker HTTP routes
        working-directory: .wrangler/commercial-v2-worker
        run: |
          python - <<'PY'
          import json
          import sys
          import urllib.parse
          import urllib.request

          sys.path.insert(0, "src")

          from app.engine import calculate, demo_building
          from app.main import default_form_values, fmt
          from app.models import model_to_json

          base = "http://127.0.0.1:8788"

          def get(path):
              with urllib.request.urlopen(base + path, timeout=20) as response:
                  body = response.read().decode("utf-8")
                  if response.status != 200:
                      raise AssertionError(f"{path} returned {response.status}")
                  return body

          def post(path, data):
              body = urllib.parse.urlencode(data).encode("utf-8")
              request = urllib.request.Request(
                  base + path,
                  data=body,
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  text = response.read().decode("utf-8")
                  if response.status != 200:
                      raise AssertionError(f"{path} returned {response.status}")
                  return text

          checks = {
              "/": "Building energy performance",
              "/health": '"status":"ok"',
              "/demo": "Cluj Demonstration House",
              "/static/app.css": ".app-shell",
              "/static/app.js": "initLocationSelector",
          }

          for path, expected in checks.items():
              body = get(path)
              if expected not in body.replace(" ", "") and expected not in body:
                  raise AssertionError(f"{path} did not contain {expected!r}")

          location_payload = json.loads(get("/api/location-data"))
          localities = location_payload.get("localities", [])
          if len(localities) != 13622:
              raise AssertionError(f"Expected 13622 localities, got {len(localities)}")

          form = default_form_values()
          form["dhw_enabled"] = "on"
          form.pop("cooling_enabled", None)
          calculation_html = post("/calculate", form)
          if "Results" not in calculation_html:
              raise AssertionError("Calculation response did not render Results")

          demo = demo_building()
          direct = calculate(demo)
          expected_primary = fmt(
              direct.primary_energy.specific_kwh_m2,
              "kWh/m²/year",
          )
          demo_html = get("/demo")
          if expected_primary not in demo_html:
              raise AssertionError(
                  f"Worker demo output did not include CPython primary-energy value {expected_primary!r}"
              )

          certificate_html = post("/certificate", {"payload": model_to_json(demo)})
          if "Energy Performance Report" not in certificate_html:
              raise AssertionError("Certificate route did not render the report")

          for locality in ["București", "Cluj-Napoca", "Brașov", "Iași", "Timișoara", "Florești"]:
              if locality not in json.dumps(location_payload, ensure_ascii=False):
                  raise AssertionError(f"Missing geographic smoke locality: {locality}")

          print("Worker HTTP smoke passed")
          print("localities", len(localities))
          print("specific_primary_energy", expected_primary)
          PY

      - name: Prepare production custom domains
        working-directory: .wrangler/commercial-v2-worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare domain preparation skipped: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both configured."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          api = "https://api.cloudflare.com/client/v4"
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }

          def request(method, path):
              req = urllib.request.Request(api + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read().decode("utf-8")
                      return response.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8")
                  try:
                      payload = json.loads(body) if body else {}
                  except json.JSONDecodeError:
                      payload = {"success": False, "errors": [{"message": body[:500]}]}
                  return error.code, payload

          def log(label, status, payload):
              print(f"{label}: HTTP {status}, success={payload.get('success')}")
              for error in payload.get("errors", [])[:5]:
                  print(f"  error {error.get('code')}: {error.get('message')}")

          status, zones = request("GET", "/zones?name=lacurent.com&per_page=1")
          log("zone lookup lacurent.com", status, zones)
          results = zones.get("result") or []
          if not results:
              raise SystemExit("No Cloudflare zone found for lacurent.com.")
          zone_id = results[0]["id"]

          for host in ("lacurent.com", "www.lacurent.com"):
              query = urllib.parse.urlencode({"name": host, "per_page": 100})
              status, records = request("GET", f"/zones/{zone_id}/dns_records?{query}")
              log(f"dns list {host}", status, records)
              dns_records = records.get("result")
              if not isinstance(dns_records, list):
                  print(f"  dns records for {host} were not available; continuing safely.")
                  dns_records = []
              for record in dns_records:
                  print(
                      "  dns",
                      record.get("type"),
                      record.get("name"),
                      record.get("content"),
                      f"proxied={record.get('proxied')}",
                  )
                  if (
                      record.get("type") == "CNAME"
                      and record.get("name") == host
                      and record.get("content") == "lacurent.pages.dev"
                  ):
                      status, deleted = request(
                          "DELETE",
                          f"/zones/{zone_id}/dns_records/{record['id']}",
                      )
                      log(f"delete Pages CNAME {host}", status, deleted)

          status, pages_domains = request(
              "GET",
              f"/accounts/{account_id}/pages/projects/lacurent/domains",
          )
          log("Pages custom domains list", status, pages_domains)
          for host in ("lacurent.com", "www.lacurent.com"):
              domains = pages_domains.get("result")
              if not isinstance(domains, list):
                  print(f"  Pages domains were not available while checking {host}; continuing safely.")
                  domains = []
              if any((item.get("name") or item.get("domain_name")) == host for item in domains):
                  encoded = urllib.parse.quote(host, safe="")
                  status, deleted = request(
                      "DELETE",
                      f"/accounts/{account_id}/pages/projects/lacurent/domains/{encoded}",
                  )
                  log(f"detach Pages custom domain {host}", status, deleted)
          PY

      - name: Deploy Commercial v2 Worker
        working-directory: .wrangler/commercial-v2-worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare staging deploy skipped: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both configured."
            exit 0
          fi
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler deploy

      - name: Verify production custom domain
        working-directory: .wrangler/commercial-v2-worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare production verification skipped: deployment credentials are not both configured."
            exit 0
          fi
          python - <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          sys.path.insert(0, "src")

          from app.engine import calculate, demo_building
          from app.main import default_form_values, fmt
          from app.models import model_to_json

          apex = "https://lacurent.com"
          staging = "https://lacurent-commercial-v2.lemnarukarol.workers.dev"

          def open_url(url, data=None, headers=None, timeout=30, follow_redirects=True):
              opener = urllib.request.build_opener()
              if not follow_redirects:
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                          return None
                  opener = urllib.request.build_opener(NoRedirect)
              request = urllib.request.Request(url, data=data, headers=headers or {})
              try:
                  with opener.open(request, timeout=timeout) as response:
                      return response.status, response.geturl(), response.read().decode("utf-8")
              except urllib.error.HTTPError as error:
                  return error.code, error.headers.get("Location") or url, error.read().decode("utf-8")

          for attempt in range(1, 41):
              status, _, body = open_url(apex + "/health")
              if status == 200 and '"status":"ok"' in body.replace(" ", ""):
                  break
              print(f"waiting for production health, attempt {attempt}: HTTP {status}")
              time.sleep(15)
          else:
              raise AssertionError("Production /health did not become healthy.")

          checks = {
              "/": "Building energy performance",
              "/health": '"status":"ok"',
              "/demo": "Cluj Demonstration House",
              "/static/app.css": ".app-shell",
              "/static/app.js": "initLocationSelector",
          }
          for path, expected in checks.items():
              status, _, body = open_url(apex + path)
              if status != 200:
                  raise AssertionError(f"{path} returned HTTP {status}")
              if expected not in body and expected not in body.replace(" ", ""):
                  raise AssertionError(f"{path} did not contain {expected!r}")
              print(path, status)

          status, _, location_body = open_url(apex + "/api/location-data")
          if status != 200:
              raise AssertionError(f"/api/location-data returned HTTP {status}")
          payload = json.loads(location_body)
          localities = payload.get("localities", [])
          if len(localities) != 13622:
              raise AssertionError(f"Expected 13622 localities, got {len(localities)}")
          print("/api/location-data", status, len(localities))

          form = default_form_values()
          form["dhw_enabled"] = "on"
          form.pop("cooling_enabled", None)
          encoded = urllib.parse.urlencode(form).encode("utf-8")
          status, _, calculation = open_url(
              apex + "/calculate",
              data=encoded,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          if status != 200 or "Results" not in calculation:
              raise AssertionError(f"/calculate failed with HTTP {status}")
          print("/calculate", status)

          demo = demo_building()
          direct = calculate(demo)
          expected_primary = fmt(
              direct.primary_energy.specific_kwh_m2,
              "kWh/m²/year",
          )
          status, _, demo_html = open_url(apex + "/demo")
          if expected_primary not in demo_html:
              raise AssertionError(
                  f"/demo did not include CPython primary-energy value {expected_primary!r}"
              )
          print("demo specific primary", expected_primary)

          report_body = urllib.parse.urlencode({"payload": model_to_json(demo)}).encode("utf-8")
          status, _, certificate = open_url(
              apex + "/certificate",
              data=report_body,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          if status != 200 or "Energy Performance Report" not in certificate:
              raise AssertionError(f"/certificate failed with HTTP {status}")
          print("/certificate", status)

          for path in ("/", "/demo?source=www"):
              status, location, _ = open_url(
                  "https://www.lacurent.com" + path,
                  follow_redirects=False,
              )
              expected = "https://lacurent.com" + path
              if status not in (301, 308) or location != expected:
                  raise AssertionError(
                      f"www redirect mismatch: HTTP {status}, location={location!r}, expected={expected!r}"
                  )
              print("www redirect", path, status, location)

          status, _, staging_health = open_url(staging + "/health")
          if status != 200 or '"status":"ok"' not in staging_health.replace(" ", ""):
              raise AssertionError("Staging workers.dev health failed after production deployment.")
          print("staging health", status)
          PY
