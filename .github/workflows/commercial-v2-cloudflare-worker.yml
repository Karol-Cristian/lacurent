              "insulation_lambda_w_mk": 0.040,
          }).encode("utf-8")
          status, _, scenario_body = open_url(
              apex + "/api/scenarios/wall-insulation",
              data=scenario_encoded,
              headers={"Content-Type": "application/json"},
          )
          if status != 200:
              raise AssertionError(f"/api/scenarios/wall-insulation failed with HTTP {status}")
          scenario_payload = json.loads(scenario_body)
          if scenario_payload.get("schema_version") != "1.0":
              raise AssertionError("Production wall-insulation scenario API returned the wrong schema version.")
          if float(scenario_payload.get("technical_requirement", {}).get("affected_area_m2", 0)) <= 0:
              raise AssertionError("Production wall-insulation scenario did not expose affected wall area.")
          energy_delta = scenario_payload.get("scenario", {}).get("delta_vs_baseline", {}).get("final_energy", {}).get("delta")
          if energy_delta is None or float(energy_delta) >= 0:
              raise AssertionError("Production wall-insulation scenario did not reduce modeled final energy.")

          product = {
              "partner_id": "demo-store",
              "product_id": "production-smoke-insulation",
              "sku": "SMOKE-100",
              "name": "Production smoke facade insulation",
              "manufacturer": "LaCurent test fixture",
              "category": "facade_insulation",
              "application": "external_wall",
              "thickness_mm": 100,
              "lambda_w_mk": 0.032,
              "package_area_m2": 4.0,
              "price_per_package_lei": 125.0,
              "stock_status": "in_stock",
              "catalog_version": "production-smoke-v1",
          }
          match_encoded = json.dumps({
              "requirement": scenario_payload["technical_requirement"],
              "products": [product],
          }).encode("utf-8")
          status, _, match_body = open_url(
              apex + "/api/products/wall-insulation/match",
              data=match_encoded,
              headers={"Content-Type": "application/json"},
          )
          if status != 200:
              raise AssertionError(f"/api/products/wall-insulation/match failed with HTTP {status}")
          match_payload = json.loads(match_body)
          if match_payload.get("compatible_count") != 1:
              raise AssertionError("Production product matcher did not identify the compatible facade product.")
          if match_payload.get("matches", [{}])[0].get("compatibility", {}).get("status") != "exceeds_requirement":
              raise AssertionError("Production product matcher returned an unexpected compatibility status.")

          product_scenario_encoded = json.dumps({
              "baseline": json.loads(model_to_json(demo_building())),
              "requirement": scenario_payload["technical_requirement"],
              "product": product,
          }).encode("utf-8")
          status, _, product_scenario_body = open_url(
              apex + "/api/scenarios/wall-insulation/product",
              data=product_scenario_encoded,
              headers={"Content-Type": "application/json"},
          )
          if status != 200:
              raise AssertionError(f"/api/scenarios/wall-insulation/product failed with HTTP {status}")
          product_scenario = json.loads(product_scenario_body)
          selected_measure = product_scenario.get("scenario_bundle", {}).get("measure", {})
          if selected_measure.get("material_source") != "partner_product":
              raise AssertionError("Production product scenario did not retain partner-product provenance.")
          if selected_measure.get("product_reference", {}).get("product_id") != product["product_id"]:
              raise AssertionError("Production product scenario lost the selected product reference.")

          print("/api/scenarios/wall-insulation", 200)
          print("/api/products/wall-insulation/match", 200)
          print("/api/scenarios/wall-insulation/product", 200)
          print("/embed/demo-store/lab-calculate", 200)

          status, _, _ = open_url(apex + "/embed/not-a-real-partner")
          if status != 404:
              raise AssertionError(f"Unknown embed partner returned HTTP {status}, expected 404")
          print("/embed/not-a-real-partner", status)

          embed_request = urllib.request.Request(
              apex + "/embed/demo-store",
              headers={"User-Agent": "LaCurent-cutover-smoke/1.0"},
          )
          with urllib.request.urlopen(embed_request, timeout=30) as response:
              frame_policy = response.headers.get("Content-Security-Policy")
              if frame_policy != "frame-ancestors *":
                  raise AssertionError(f"Unexpected production embed frame policy: {frame_policy!r}")
          public_request = urllib.request.Request(
              apex + "/home-lab-next",
              headers={"User-Agent": "LaCurent-cutover-smoke/1.0"},
          )
          with urllib.request.urlopen(public_request, timeout=30) as response:
              if response.headers.get("Content-Security-Policy") is not None:
                  raise AssertionError("Public calculator unexpectedly received embed frame policy.")

          demo = demo_building()
          direct = calculate(demo)
          expected_primary = fmt(
              direct.primary_energy.specific_kwh_m2,
              "kWh/m²/year",
          )
          status, _, demo_html = open_url(apex + "/demo")
          if expected_primary not in demo_html:
              raise AssertionError(
                  f"/demo did not include CPython primary-energy value {expected_primary!r}"
              )
          print("demo specific primary", expected_primary)

          report_body = urllib.parse.urlencode({"payload": model_to_json(demo)}).encode("utf-8")
          status, _, certificate = open_url(
              apex + "/certificate",
              data=report_body,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          if status != 200 or "Energy Performance Report" not in certificate:
              raise AssertionError(f"/certificate failed with HTTP {status}")
          print("/certificate", status)

          for path in ("/", "/demo?source=www"):
              status, location, _ = open_url(
                  "https://www.lacurent.com" + path,
                  follow_redirects=False,
              )
              expected = "https://lacurent.com" + path
              if status not in (301, 308) or location != expected:
                  raise AssertionError(
                      f"www redirect mismatch: HTTP {status}, location={location!r}, expected={expected!r}"
                  )
              print("www redirect", path, status, location)

          status, _, staging_health = open_url(staging + "/health")
          if status != 200 or '"status":"ok"' not in staging_health.replace(" ", ""):
              raise AssertionError("Staging workers.dev health failed after production deployment.")
          print("staging health", status)
          PY
