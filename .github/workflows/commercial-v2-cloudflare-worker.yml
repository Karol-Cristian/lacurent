name: Commercial v2 Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - codex/commercial-v2-cloudflare-python
    paths:
      - ".github/workflows/commercial-v2-cloudflare-worker.yml"
      - "commercial/**"
      - "scripts/prepare-commercial-cloudflare-worker.mjs"

# Production deploys must finish in queue order. Without a shared concurrency
# group, two close pushes can deploy in parallel and an older run can finish
# last, replacing a newer release.
concurrency:
  group: commercial-v2-production
  queue: max

permissions:
  contents: read
  pull-requests: read

jobs:
  worker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require merged PR origin for production pushes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          target = os.environ["GITHUB_REF_NAME"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/pulls",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull_requests = json.loads(response.read().decode("utf-8"))

          valid = [
              pr for pr in pull_requests
              if pr.get("merged_at")
              and pr.get("base", {}).get("ref") == target
              and pr.get("merge_commit_sha") == sha
          ]
          if not valid:
              raise SystemExit(
                  "Production push is not the merge commit of a merged PR targeting "
                  f"{target}. Direct-push deployments are blocked."
              )

          print("Production push originated from merged PR(s):", ", ".join(
              f"#{pr['number']}" for pr in valid
          ))
          PY

      - name: Validate production deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Production deploy requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install local Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial/requirements.txt

      - name: Run normal Commercial v2 checks
        run: |
          git diff --check
          node --check commercial/static/app.js
          node --check commercial/static/elivio.js
          node --check commercial/static/home-lab-next.js
          node --check commercial/static/home-lab-3d.js
          node --test commercial/tests/intake.test.cjs
          python -m compileall -q commercial
          python -m pytest commercial/tests -q

      - name: Install uv
        run: python -m pip install uv

      - name: Prepare Cloudflare Worker bundle
        run: node scripts/prepare-commercial-cloudflare-worker.mjs

      - name: Install current Wrangler
        working-directory: .wrangler/commercial-v2-worker
        run: |
          npm install --save-dev wrangler@latest
          npx wrangler --version

      - name: Sync Python Worker dependencies
        working-directory: .wrangler/commercial-v2-worker
        run: |
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          wrangler --version
          uvx --from workers-py pywrangler --version
          uvx --from workers-py pywrangler sync --force

      - name: Prove real Worker runtime
        working-directory: .wrangler/commercial-v2-worker
        run: |
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler dev --ip 127.0.0.1 --port 8788 > worker-dev.log 2>&1 &
          echo "$!" > worker-dev.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8788/health; then
              break
            fi
            if ! kill -0 "$(cat worker-dev.pid)" 2>/dev/null; then
              cat worker-dev.log
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8788/health

      - name: Smoke-test Worker HTTP routes
        working-directory: .wrangler/commercial-v2-worker
        run: |
          python - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          sys.path.insert(0, "src")

          from app.engine import calculate, demo_building
          from app.main import default_form_values, fmt
          from app.models import model_to_json

          base = "http://127.0.0.1:8788"

          def get(path):
              print(f"GET {path}", flush=True)
              try:
                  with urllib.request.urlopen(base + path, timeout=20) as response:
                      body = response.read().decode("utf-8")
                      if response.status != 200:
                          raise AssertionError(f"{path} returned {response.status}")
                      return body
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise AssertionError(f"{path} returned HTTP {exc.code}: {body[:800]}") from exc

          def get_binary(path):
              with urllib.request.urlopen(base + path, timeout=20) as response:
                  body = response.read()
                  content_type = response.headers.get("Content-Type", "")
                  if response.status != 200:
                      raise AssertionError(f"{path} returned {response.status}")
                  return body, content_type

          def post(path, data):
              body = urllib.parse.urlencode(data).encode("utf-8")
              request = urllib.request.Request(
                  base + path,
                  data=body,
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  text = response.read().decode("utf-8")
                  if response.status != 200:
                      raise AssertionError(f"{path} returned {response.status}")
                  return text

          def post_json(path, data):
              body = json.dumps(data).encode("utf-8")
              request = urllib.request.Request(
                  base + path,
                  data=body,
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  text = response.read().decode("utf-8")
                  if response.status != 200:
                      raise AssertionError(f"{path} returned {response.status}")
                  return text

          checks = {
              "/": 'data-page="testing-home"',
              "/software-testing": 'data-page="software-testing"',
              "/instalatii": "data-home-lab-next",
              "/instalatii/calculator/legacy": "romaniaLocationMap",
              "/embed": "LaCurent Embed",
              "/embed-host-demo": "SITE DEMO PARTENER",
              "/magazin": "Depozitul Constructorului",
              "/embed/demo-store": "lab-summary-rail",
              "/static/embed-house-lab.js": "renderServiceDonut",
              "/static/home-lab/home-envelope.svg": "<svg",
              "/static/home-lab/window-orientation-card.svg": "<svg",
              "/static/home-lab/wood-fireplace.svg": "<svg",
              "/static/home-lab/district-heating.svg": "<svg",
              "/static/embed-loader.js": "lacurent:embed-viewport",
              "/software-testing/resources": "Useful verification knowledge",
              "/static/company.css": ".company-shell",
              "/static/testing_intake.css": ".intake-details",
              "/static/software_testing_v2.css": ".clean-hero",
              "/static/painpoints.css": ".measured-result",
              "/static/favicon.svg": "<svg",
              "/health": '"status":"ok"',
              "/api/market-cost-basis": '"costs"',
              "/api/heating-products": '"options"',
              "/demo": "Cluj Demonstration House",
              "/static/app.css": ".app-shell",
              "/static/app.js": "initLocationSelector",
              "/instalatii/calculator": "data-home-lab-next",
              "/home-lab/facts": "SIMULĂRI PUBLICE",
              "/robots.txt": "Sitemap: https://lacurent.com/sitemap.xml",
              "/sitemap.xml": "https://lacurent.com/home-lab/facts",
              "/static/simulation-facts.css": ".facts-grid",
              "/home-lab-next": "data-home-lab-next",
              "/static/home-lab-next.js": "function openMeasure",
              "/static/home-lab-next.css": ".hln-before-after",
              "/static/home-lab-product.js": "data-hlp-demo-shell",
              "/static/home-lab-product.css": ".hlp-house-stage",
              "/elivio-consilio": "data-chat-launcher",
              "/elivio-consilio/confidentialitate": "Confidențialitate și AI",
              "/static/elivio.css": ".ec-hero",
              "/static/elivio.js": "data-elivio-chat",
          }

          for path, expected in checks.items():
              body = get(path)
              if expected not in body.replace(" ", "") and expected not in body:
                  raise AssertionError(f"{path} did not contain {expected!r}")

          retired_fact = "Podul trebuie izolat întotdeauna primul? Nu."
          facts_html = get("/home-lab/facts")
          if retired_fact in facts_html:
              raise AssertionError("Retired invalid Home Lab fact is still published.")

          for path in (
              "/home-lab-assets/house-fireplace.webp?v=2",
              "/home-lab-assets/house-orientation.webp?v=2",
              "/home-lab-assets/house-pv.webp?v=2",
          ):
              body, content_type = get_binary(path)
              if not body.startswith(b"RIFF") or b"WEBP" not in body[:16]:
                  raise AssertionError(f"{path} did not return a valid WebP payload.")
              if "image/webp" not in content_type.lower():
                  raise AssertionError(f"{path} returned unexpected content type {content_type!r}")

          home_lab_html = get("/embed/demo-store")
          if home_lab_html.count('data-lab-chapter-open=') != 6:
              raise AssertionError("Home Lab cockpit did not expose all six MC001 chapter tiles.")
          for marker in (
              "Panouri fotovoltaice",
              "Iluminat LED",
              'data-lab-product-action="heat_pump"',
              'class="lab-house-mode-bar"',
              'id="labConfirmCurrentHome"',
              "Salvează casa mea → renovări",
              'id="labContextImage"',
              'id="labRenovationChooser"',
              "Ce vrei să îmbunătățești?",
              'id="labMobilePrimaryAction"',
              'id="labMobileHomeAction"',
              'id="labRenovationValueStrip"',
              'id="labMobileCo2"',
              'data-renovation-action="wall"',
              'data-renovation-action="floor"',
              'data-renovation-action="heating"',
              'data-renovation-scope="wall"',
              'data-renovation-scope="heating"',
              "<strong>Anvelopă</strong>",
              "<strong>Instalații</strong>",
          ):
              if marker not in home_lab_html:
                  raise AssertionError(f"Home Lab house-first flow missing {marker!r}")
          loader_html = get("/static/embed-loader.js")
          for marker in (
              "isMobileCockpit",
              "mobileViewportHeight",
              "lacurent:embed-focus-request",
              "lacurent:embed-focus-state",
              "data-lacurent-focus-bar",
              "Înapoi la magazin",
              'host.style.position = "fixed"',
              'host.dataset.path',
              'host.dataset.deferred === "true"',
              "window.LaCurentEmbed",
          ):
              if marker not in loader_html:
                  raise AssertionError(f"Embed loader missing mobile focus-mode marker {marker!r}.")
          lab_css = get("/static/embed-house-lab.css")
          if ("lab-mobile-livebar-metrics" not in lab_css or "lab-renovation-grid" not in lab_css or "lab-renovation-value-strip" not in lab_css or 'min-height:144px!important' not in lab_css):
              raise AssertionError("Home Lab CSS missing guided renovation mobile cockpit.")
          runtime_html = get("/static/embed-runtime.js")
          if "requestMobileFocus" not in runtime_html or "embed-focus-active" not in runtime_html:
              raise AssertionError("Embed runtime did not request/reflect mobile focus mode.")

          home_html = get("/")
          sales_html = get("/software-testing")
          assert 'href="/software-testing#quick-check"' in home_html
          assert 'data-page="software-testing"' not in home_html
          assert 'data-page="testing-home"' not in sales_html
          energy_html = get("/instalatii")
          assert "data-home-lab-next" in energy_html
          assert "Casa este interfața." in energy_html
          for marker in ('id="quick-check"', 'id="brief-preview"', 'id="copy-brief"', 'id="open-email"', 'href="#quick-check"'):
              assert marker in sales_html, f"Missing sales-flow marker: {marker}"

          location_payload = json.loads(get("/api/location-data"))
          localities = location_payload.get("localities", [])
          if len(localities) != 13622:
              raise AssertionError(f"Expected 13622 localities, got {len(localities)}")

          form = default_form_values()
          form["dhw_enabled"] = "on"
          form.pop("cooling_enabled", None)
          calculation_html = post("/calculate", form)
          if "Results" not in calculation_html:
              raise AssertionError("Calculation response did not render Results")

          embed_calculation_html = post("/embed/demo-store/calculate", form)
          if "Cere ofertă pentru casa configurată" not in embed_calculation_html:
              raise AssertionError("Embedded calculation did not preserve the partner conversion CTA")

          lab_form = dict(form)
          lab_form.update({
              "expert_geometry_override": "on",
              "expert_envelope_override": "on",
              "expert_ventilation_override": "on",
          })
          lab_payload = json.loads(post("/embed/demo-store/lab-calculate", lab_form))
          if float(lab_payload.get("final_energy_kwh", 0)) <= 0:
              raise AssertionError("Embedded house lab did not return final energy.")
          if float(lab_payload.get("design_heat_load_kw", 0)) <= 0:
              raise AssertionError("Embedded house lab did not return design heat load.")

          next_html = get("/home-lab-next")
          for marker in (
              'data-hln-screen="home"',
              'data-hln-screen="site"',
              'data-hln-screen="intervention"',
              'data-hln-screen="scenario"',
              "Salvează Casa mea și vezi îmbunătățirile",
              "Păstrează intervenția",
              'class="hln-house-board"',
              'class="hln-impact-panel"',
              'id="hln-i-wall"',
          ):
              if marker not in next_html:
                  raise AssertionError(f"Home Lab Next missing {marker!r}")

          partner_next_html = get("/embed/demo-store/next")
          if 'data-partner-id="demo-store"' not in partner_next_html:
              raise AssertionError("Partner Home Lab Next lost partner scope.")

          next_payload = json.loads(post("/api/home-lab-next/calculate", lab_form))
          if float(next_payload.get("final_energy_kwh", 0)) <= 0:
              raise AssertionError("Home Lab Next API did not return final energy.")
          partner_next_payload = json.loads(post("/embed/demo-store/next/calculate", lab_form))
          if float(partner_next_payload.get("design_heat_load_kw", 0)) <= 0:
              raise AssertionError("Partner Home Lab Next API did not return design heat load.")

          optimizer_form = dict(lab_form)
          optimizer_form["_optimization_mode"] = "auto_economic"
          optimizer_plan = json.loads(post(
              "/api/optimization/home-lab/v2/plan",
              optimizer_form,
          ))
          if optimizer_plan.get("optimizerVersion") != "v2-worker-safe":
              raise AssertionError("Worker-safe V2 plan returned the wrong optimizer version.")
          shortlist = optimizer_plan.get("shortlist") or []
          run_branch_ids = optimizer_plan.get("runBranchIds") or []
          if not shortlist or not run_branch_ids:
              raise AssertionError("Worker-safe V2 plan did not expose shortlist/branches.")
          if int(optimizer_plan.get("representativeEvaluations") or 0) > 29:
              raise AssertionError("Worker-safe V2 representative search exceeded its CPU bound.")

          optimizer_branch_results = []
          for branch_id in run_branch_ids:
              branch_payload = json.loads(post_json(
                  "/api/optimization/home-lab/v2/branch",
                  {
                      "form": optimizer_form,
                      "branchId": branch_id,
                      "shortlist": shortlist,
                  },
              ))
              if branch_payload.get("optimizerVersion") != "v2-worker-safe":
                  raise AssertionError(f"V2 branch {branch_id} returned the wrong version.")
              if int(branch_payload.get("fastEvaluations") or 0) > len(shortlist):
                  raise AssertionError(f"V2 branch {branch_id} exceeded shortlist evaluation bound.")
              optimizer_branch_results.append(branch_payload)

          optimizer_final = json.loads(post_json(
              "/api/optimization/home-lab/v2/finalize",
              {
                  "form": optimizer_form,
                  "branchResults": optimizer_branch_results,
                  "representativeEvaluations": optimizer_plan.get("representativeEvaluations", 0),
                  "representativePoolSize": optimizer_plan.get("representativePoolSize", 0),
                  "shortlistSize": len(shortlist),
                  "priorCalculationTimeMs": optimizer_plan.get("calculationTimeMs", 0),
              },
          ))
          optimizer_meta = optimizer_final.get("optimization") or {}
          if optimizer_meta.get("optimizerVersion") != "v2-worker-safe":
              raise AssertionError("Worker-safe V2 finalize returned the wrong optimizer version.")
          if int(optimizer_meta.get("fullEngineVerifications") or 0) > 3:
              raise AssertionError("Worker-safe V2 exceeded canonical verification bound.")
          if float((optimizer_final.get("scenario") or {}).get("final_energy_kwh", 0)) <= 0:
              raise AssertionError("Worker-safe V2 did not return a valid final scenario.")

          scenario_payload = json.loads(post_json(
              "/api/scenarios/wall-insulation",
              {
                  "baseline": json.loads(model_to_json(demo_building())),
                  "added_insulation_thickness_mm": 100,
                  "insulation_lambda_w_mk": 0.040,
              },
          ))
          if scenario_payload.get("schema_version") != "1.0":
              raise AssertionError("Wall-insulation scenario API did not return schema version 1.0.")
          requirement = scenario_payload.get("technical_requirement", {})
          if float(requirement.get("affected_area_m2", 0)) <= 0:
              raise AssertionError("Wall-insulation scenario did not expose affected wall area.")
          energy_delta = scenario_payload.get("scenario", {}).get("delta_vs_baseline", {}).get("final_energy", {}).get("delta")
          if energy_delta is None or float(energy_delta) >= 0:
              raise AssertionError("Wall-insulation scenario did not reduce modeled final energy.")

          product = {
              "partner_id": "demo-store",
              "product_id": "worker-smoke-insulation",
              "sku": "SMOKE-100",
              "name": "Worker smoke facade insulation",
              "manufacturer": "LaCurent test fixture",
              "category": "facade_insulation",
              "application": "external_wall",
              "thickness_mm": 100,
              "lambda_w_mk": 0.032,
              "package_area_m2": 4.0,
              "price_per_package_lei": 125.0,
              "stock_status": "in_stock",
              "catalog_version": "worker-smoke-v1",
          }
          match_payload = json.loads(post_json(
              "/api/products/wall-insulation/match",
              {"requirement": requirement, "products": [product]},
          ))
          if match_payload.get("compatible_count") != 1:
              raise AssertionError("Worker product matcher did not identify the compatible facade product.")
          match = match_payload.get("matches", [{}])[0]
          if match.get("compatibility", {}).get("status") != "exceeds_requirement":
              raise AssertionError("Worker product matcher returned an unexpected compatibility status.")
          if int(match.get("quantity", {}).get("minimum_packages_no_waste") or 0) <= 0:
              raise AssertionError("Worker product matcher did not calculate package quantity.")

          product_scenario = json.loads(post_json(
              "/api/scenarios/wall-insulation/product",
              {
                  "baseline": json.loads(model_to_json(demo_building())),
                  "requirement": requirement,
                  "product": product,
              },
          ))
          selected_measure = product_scenario.get("scenario_bundle", {}).get("measure", {})
          if selected_measure.get("material_source") != "partner_product":
              raise AssertionError("Worker product scenario did not retain partner-product provenance.")
          if selected_measure.get("product_reference", {}).get("product_id") != product["product_id"]:
              raise AssertionError("Worker product scenario lost the selected product reference.")

          with urllib.request.urlopen(base + "/embed/demo-store", timeout=20) as response:
              frame_policy = response.headers.get("Content-Security-Policy")
              if frame_policy != "frame-ancestors *":
                  raise AssertionError(f"Unexpected embed frame policy: {frame_policy!r}")

          demo = demo_building()
          direct = calculate(demo)
          expected_primary = fmt(
              direct.primary_energy.specific_kwh_m2,
              "kWh/m²/year",
          )
          demo_html = get("/demo")
          if expected_primary not in demo_html:
              raise AssertionError(
                  f"Worker demo output did not include CPython primary-energy value {expected_primary!r}"
              )

          certificate_html = post("/certificate", {"payload": model_to_json(demo)})
          if "Energy Performance Report" not in certificate_html:
              raise AssertionError("Certificate route did not render the report")

          for locality in ["București", "Cluj-Napoca", "Brașov", "Iași", "Timișoara", "Florești"]:
              if locality not in json.dumps(location_payload, ensure_ascii=False):
                  raise AssertionError(f"Missing geographic smoke locality: {locality}")

          print("Worker HTTP smoke passed")
          print("localities", len(localities))
          print("specific_primary_energy", expected_primary)
          PY

      - name: Prepare production custom domains
        working-directory: .wrangler/commercial-v2-worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare domain preparation requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          api = "https://api.cloudflare.com/client/v4"
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }

          def request(method, path):
              req = urllib.request.Request(api + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read().decode("utf-8")
                      return response.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8")
                  try:
                      payload = json.loads(body) if body else {}
                  except json.JSONDecodeError:
                      payload = {"success": False, "errors": [{"message": body[:500]}]}
                  return error.code, payload

          def log(label, status, payload):
              print(f"{label}: HTTP {status}, success={payload.get('success')}")
              for error in payload.get("errors", [])[:5]:
                  print(f"  error {error.get('code')}: {error.get('message')}")

          status, zones = request("GET", "/zones?name=lacurent.com&per_page=1")
          log("zone lookup lacurent.com", status, zones)
          results = zones.get("result") or []
          if not results:
              raise SystemExit("No Cloudflare zone found for lacurent.com.")
          zone_id = results[0]["id"]

          for host in ("lacurent.com", "www.lacurent.com"):
              query = urllib.parse.urlencode({"name": host, "per_page": 100})
              status, records = request("GET", f"/zones/{zone_id}/dns_records?{query}")
              log(f"dns list {host}", status, records)
              dns_records = records.get("result")
              if not isinstance(dns_records, list):
                  print(f"  dns records for {host} were not available; continuing safely.")
                  dns_records = []
              for record in dns_records:
                  print(
                      "  dns",
                      record.get("type"),
                      record.get("name"),
                      record.get("content"),
                      f"proxied={record.get('proxied')}",
                  )
                  if (
                      record.get("type") == "CNAME"
                      and record.get("name") == host
                      and record.get("content") == "lacurent.pages.dev"
                  ):
                      status, deleted = request(
                          "DELETE",
                          f"/zones/{zone_id}/dns_records/{record['id']}",
                      )
                      log(f"delete Pages CNAME {host}", status, deleted)

          status, routes = request("GET", f"/zones/{zone_id}/workers/routes")
          log("Worker routes list", status, routes)
          route_items = routes.get("result")
          if not isinstance(route_items, list):
              print("  Worker routes were not available; continuing safely.")
              route_items = []

          def route_host(pattern):
              value = str(pattern or "").lower()
              for prefix in ("https://", "http://"):
                  if value.startswith(prefix):
                      value = value[len(prefix):]
              return value.split("/", 1)[0]

          for route in route_items:
              pattern = route.get("pattern")
              script = route.get("script")
              host = route_host(pattern)
              print("  route", pattern, "script=", script)
              if script == "lacurent" and host in {"lacurent.com", "www.lacurent.com"}:
                  print(f"  rollback note: recreate route {pattern!r} -> script 'lacurent' if rollback is needed.")
                  status, deleted = request(
                      "DELETE",
                      f"/zones/{zone_id}/workers/routes/{route['id']}",
                  )
                  log(f"delete legacy Worker route {pattern}", status, deleted)

          status, pages_domains = request(
              "GET",
              f"/accounts/{account_id}/pages/projects/lacurent/domains",
          )
          log("Pages custom domains list", status, pages_domains)
          for host in ("lacurent.com", "www.lacurent.com"):
              domains = pages_domains.get("result")
              if not isinstance(domains, list):
                  print(f"  Pages domains were not available while checking {host}; continuing safely.")
                  domains = []
              if any((item.get("name") or item.get("domain_name")) == host for item in domains):
                  encoded = urllib.parse.quote(host, safe="")
                  status, deleted = request(
                      "DELETE",
                      f"/accounts/{account_id}/pages/projects/lacurent/domains/{encoded}",
                  )
                  log(f"detach Pages custom domain {host}", status, deleted)
          PY

