          product_scenario = json.loads(product_scenario_body)
          selected_measure = product_scenario.get("scenario_bundle", {}).get("measure", {})
          if selected_measure.get("material_source") != "partner_product":
              raise AssertionError("Production product scenario did not retain partner-product provenance.")
          if selected_measure.get("product_reference", {}).get("product_id") != product["product_id"]:
              raise AssertionError("Production product scenario lost the selected product reference.")

          print("/api/scenarios/wall-insulation", 200)
          print("/api/products/wall-insulation/match", 200)
          print("/api/scenarios/wall-insulation/product", 200)
          print("/embed/demo-store/lab-calculate", 200)

          status, _, _ = open_url(apex + "/embed/not-a-real-partner")
