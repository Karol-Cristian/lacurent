              raise AssertionError(f"/api/scenarios/wall-insulation failed with HTTP {status}")
          scenario_payload = json.loads(scenario_body)
          if scenario_payload.get("schema_version") != "1.0":
              raise AssertionError("Production wall-insulation scenario API returned the wrong schema version.")
          if float(scenario_payload.get("technical_requirement", {}).get("affected_area_m2", 0)) <= 0:
              raise AssertionError("Production wall-insulation scenario did not expose affected wall area.")
          energy_delta = scenario_payload.get("scenario", {}).get("delta_vs_baseline", {}).get("final_energy", {}).get("delta")
          if energy_delta is None or float(energy_delta) >= 0:
              raise AssertionError("Production wall-insulation scenario did not reduce modeled final energy.")

          product = {
              "partner_id": "demo-store",
              "product_id": "production-smoke-insulation",
              "sku": "SMOKE-100",
              "name": "Production smoke facade insulation",
              "manufacturer": "LaCurent test fixture",
              "category": "facade_insulation",
              "application": "external_wall",
              "thickness_mm": 100,
              "lambda_w_mk": 0.032,
              "package_area_m2": 4.0,
              "price_per_package_lei": 125.0,
              "stock_status": "in_stock",
              "catalog_version": "production-smoke-v1",
          }
          match_encoded = json.dumps({
              "requirement": scenario_payload["technical_requirement"],
              "products": [product],
          }).encode("utf-8")
          status, _, match_body = open_url(
              apex + "/api/products/wall-insulation/match",
              data=match_encoded,
              headers={"Content-Type": "application/json"},
          )
          if status != 200:
              raise AssertionError(f"/api/products/wall-insulation/match failed with HTTP {status}")
          match_payload = json.loads(match_body)
          if match_payload.get("compatible_count") != 1:
              raise AssertionError("Production product matcher did not identify the compatible facade product.")
          if match_payload.get("matches", [{}])[0].get("compatibility", {}).get("status") != "exceeds_requirement":
              raise AssertionError("Production product matcher returned an unexpected compatibility status.")

          product_scenario_encoded = json.dumps({
              "baseline": json.loads(model_to_json(demo_building())),
              "requirement": scenario_payload["technical_requirement"],
              "product": product,
          }).encode("utf-8")
          status, _, product_scenario_body = open_url(
              apex + "/api/scenarios/wall-insulation/product",
