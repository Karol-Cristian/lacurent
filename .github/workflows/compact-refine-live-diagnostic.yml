name: Compact refinement live 500 diagnostic
on:
  push:
    branches:
      - diagnostic/compact-refine-live-500
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe-compact-refine-live.py
