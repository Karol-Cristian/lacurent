name: pyBuildingEnergy Cloudflare PoC

on:
  workflow_dispatch:
  push:
    branches:
      - codex/pbe-cloudflare-poc
    paths:
      - ".github/workflows/pbe-cloudflare-poc.yml"
      - "commercial/**"
      - "scripts/prepare-commercial-cloudflare-worker.mjs"

jobs:
  pbe-worker-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install local test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial/requirements.txt
          python -m pip install -r commercial/requirements-pbe-iso52016.txt

      - name: Run isolated PBE tests
        run: |
          git diff --check
          python -m compileall -q commercial
          python -m pytest commercial/tests/test_pbe_cloudflare_poc.py commercial/tests/test_pbe_iso52016_compare.py -q -s

      - name: Install uv
        run: python -m pip install uv

      - name: Prepare Worker bundle
        run: |
          node scripts/prepare-commercial-cloudflare-worker.mjs
          cp commercial/cloudflare-worker/wrangler-pbe-poc.toml .wrangler/commercial-v2-worker/wrangler.toml
          echo "Prepared source bytes: $(du -sb .wrangler/commercial-v2-worker | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install current Wrangler
        working-directory: .wrangler/commercial-v2-worker
        run: |
          npm install --save-dev wrangler@latest
          npx wrangler --version

      - name: Sync Python Worker dependencies
        working-directory: .wrangler/commercial-v2-worker
        run: |
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler --version
          uvx --from workers-py pywrangler sync --force
          echo "Worker tree bytes after dependency sync: $(du -sb . | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove PBE in real Python Worker runtime
        working-directory: .wrangler/commercial-v2-worker
        run: |
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"

          start_ms=$(date +%s%3N)
          uvx --from workers-py pywrangler dev --ip 127.0.0.1 --port 8788 > pbe-worker.log 2>&1 &
          echo "$!" > pbe-worker.pid

          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8788/api/experimental/pbe-health > pbe-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat pbe-worker.pid)" 2>/dev/null; then
              cat pbe-worker.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat pbe-worker.log
            exit 1
          fi

          ready_ms=$(date +%s%3N)
          startup_ms=$((ready_ms - start_ms))
          echo "Local Worker first-ready time: \${startup_ms} ms" >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("pbe-health.json").read_text())
          assert health["status"] == "ok", health
          assert health["pbe_upstream_version"] == "2.0.3", health
          assert health["probe_primary_energy_kwh"] == 2420.0, health
          print(json.dumps(health, indent=2))
          PY

          curl -fsS http://127.0.0.1:8788/api/experimental/pbe-demo > pbe-demo.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("pbe-demo.json").read_text())
          assert payload["status"] == "ok", payload
          assert payload["comparison"]["matches_current_accounting"] is True, payload
          assert payload["comparison"]["absolute_delta_kwh"] <= 0.01, payload
          print(json.dumps({
              "comparison": payload["comparison"],
              "pbe_elapsed_ms": payload["pbe"]["elapsed_ms"],
              "carriers": payload["pbe"]["delivered_energy_by_carrier_kwh"],
          }, indent=2))
          PY

          echo "PBE runtime probe:" >> "$GITHUB_STEP_SUMMARY"
          cat pbe-health.json >> "$GITHUB_STEP_SUMMARY"

      - name: Stop local Worker
        if: always()
        run: |
          workdir=".wrangler/commercial-v2-worker"
          if [ -f "$workdir/pbe-worker.pid" ]; then
            kill "$(cat "$workdir/pbe-worker.pid")" 2>/dev/null || true
          fi
          if [ -f "$workdir/pbe-worker.log" ]; then
            tail -n 120 "$workdir/pbe-worker.log"
          fi

      - name: Deploy isolated PBE Worker
        working-directory: .wrangler/commercial-v2-worker
        run: |
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler deploy

      - name: Measure deployed PBE Worker
        working-directory: .wrangler/commercial-v2-worker
        run: |
          python - <<'PY'
          import json
          import statistics
          import time
          import urllib.request

          base = "https://lacurent-pbe-poc.lemnarukarol.workers.dev"

          def timed(path):
              started = time.perf_counter()
              with urllib.request.urlopen(base + path, timeout=60) as response:
                  body = response.read().decode("utf-8")
                  status = response.status
              return (time.perf_counter() - started) * 1000.0, status, json.loads(body)

          first_ms, status, health = timed("/api/experimental/pbe-health")
          assert status == 200, (status, health)
          assert health["status"] == "ok", health

          warm = []
          for _ in range(5):
              ms, status, payload = timed("/api/experimental/pbe-demo")
              assert status == 200, (status, payload)
              assert payload["comparison"]["matches_current_accounting"] is True, payload
              warm.append(ms)

          result = {
              "workers_dev_url": base,
              "first_health_http_ms": round(first_ms, 1),
              "pbe_probe_compute_ms": health["probe_elapsed_ms"],
              "warm_demo_http_ms": [round(x, 1) for x in warm],
              "warm_demo_median_ms": round(statistics.median(warm), 1),
              "numpy_version": health["numpy_version"],
              "pandas_version": health["pandas_version"],
              "pbe_upstream_version": health["pbe_upstream_version"],
          }
          print(json.dumps(result, indent=2))
          with open("deployed-pbe-metrics.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
          PY
          echo "Deployed PBE Worker metrics:" >> "$GITHUB_STEP_SUMMARY"
          cat deployed-pbe-metrics.json >> "$GITHUB_STEP_SUMMARY"
