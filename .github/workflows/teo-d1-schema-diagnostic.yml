name: TEO D1 Schema Diagnostic

on:
  push:
    branches:
      - codex/diagnose-teo-verify-live-20261001
    paths:
      - .github/workflows/teo-d1-schema-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect production TEO flow table
        run: |
          set -euo pipefail
          npx --yes wrangler@4.145.0 d1 execute lacurent-db --remote --config commercial/cloudflare-worker/wrangler.toml --command="SELECT type,name,sql FROM sqlite_master WHERE name='teo_verification_runs' OR tbl_name='teo_verification_runs';"
          npx --yes wrangler@4.145.0 d1 execute lacurent-db --remote --config commercial/cloudflare-worker/wrangler.toml --command="PRAGMA table_info(teo_verification_runs);"
          npx --yes wrangler@4.145.0 d1 execute lacurent-db --remote --config commercial/cloudflare-worker/wrangler.toml --command="SELECT run_id,status,planned_verifications,verified_count,next_allowed_at_ms,in_flight,lease_token,lease_expires_at_ms,updated_at FROM teo_verification_runs WHERE run_id LIKE 'diag-%' ORDER BY updated_at DESC LIMIT 5;"
      - name: Test UPDATE on diagnostic row only
        run: |
          set -euo pipefail
          ROW=$(npx --yes wrangler@4.145.0 d1 execute lacurent-db --remote --config commercial/cloudflare-worker/wrangler.toml --json --command="SELECT run_id FROM teo_verification_runs WHERE run_id LIKE 'diag-%' ORDER BY updated_at DESC LIMIT 1;")
          echo "$ROW"
          RUN_ID=$(printf '%s' "$ROW" | python -c 'import json,sys; d=json.load(sys.stdin); rows=(d[0].get("results") or []) if d else []; print(rows[0]["run_id"] if rows else "")')
          test -n "$RUN_ID"
          echo "Testing row: $RUN_ID"
          npx --yes wrangler@4.145.0 d1 execute lacurent-db --remote --config commercial/cloudflare-worker/wrangler.toml --command="UPDATE teo_verification_runs SET status='cooldown', next_allowed_at_ms=1, in_flight=0, lease_token=NULL, lease_expires_at_ms=0, updated_at=CURRENT_TIMESTAMP WHERE run_id='$RUN_ID'; SELECT changes() AS changed;"
          npx --yes wrangler@4.145.0 d1 execute lacurent-db --remote --config commercial/cloudflare-worker/wrangler.toml --command="UPDATE teo_verification_runs SET status='complete', in_flight=0, lease_token=NULL, lease_expires_at_ms=0, updated_at=CURRENT_TIMESTAMP WHERE run_id='$RUN_ID'; SELECT changes() AS changed;"
          npx --yes wrangler@4.145.0 d1 execute lacurent-db --remote --config commercial/cloudflare-worker/wrangler.toml --command="DELETE FROM teo_verification_runs WHERE run_id='$RUN_ID'; SELECT changes() AS deleted;"
