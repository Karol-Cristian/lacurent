name: Editorial UI Preview

on:
  pull_request:
    branches:
      - codex/commercial-v2-cloudflare-python
    paths:
      - "commercial/static/home-lab-editorial.css"
      - "commercial/static/home-lab-editorial.js"
      - "commercial/templates/home_lab_editorial.html"
      - "commercial/cloudflare-worker/wrangler.ui-preview.toml"
      - ".github/workflows/editorial-ui-preview.yml"

concurrency:
  group: editorial-ui-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://lacurent-editorial-ui-preview.lemnarukarol.workers.dev

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate preview credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install uv
        run: python -m pip install uv

      - name: Prepare isolated preview bundle
        run: |
          node scripts/prepare-commercial-cloudflare-worker.mjs --name lacurent-editorial-ui-preview
          cp commercial/cloudflare-worker/wrangler.ui-preview.toml .wrangler/commercial-v2-worker/wrangler.toml

      - name: Install Wrangler
        working-directory: .wrangler/commercial-v2-worker
        run: npm install --save-dev wrangler@latest

      - name: Sync Python Worker dependencies
        working-directory: .wrangler/commercial-v2-worker
        run: |
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force

      - name: Deploy isolated preview Worker
        working-directory: .wrangler/commercial-v2-worker
        run: npx wrangler deploy

      - name: Smoke-test Editorial preview
        run: |
          check_marker() {
            path="$1"
            marker="$2"
            for attempt in $(seq 1 20); do
              body="$(curl -sSL "$PREVIEW_URL$path" || true)"
              if printf '%s' "$body" | grep -q "$marker"; then
                return 0
              fi
              sleep 5
            done
            echo "::error::Preview marker '$marker' not available at $path after propagation window."
            return 1
          }
          check_marker "/health" '"status":"ok"'
          check_marker "/home-lab-editorial" 'data-page="house"'
          check_marker "/home-lab-editorial" 'data-page="goal"'

      - name: Publish preview URL
        run: |
          echo "## Editorial UI preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL/home-lab-editorial" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview only — no custom domain routes and no production deployment." >> "$GITHUB_STEP_SUMMARY"
