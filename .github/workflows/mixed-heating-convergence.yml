name: Mixed Heating Optimizer Convergence

on:
  push:
    branches:
      - diagnostic/mixed-heating-convergence-20260925

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial/requirements.txt
      - name: Compare search depths
        env:
          PYTHONPATH: .
        run: python scripts/benchmark-mixed-heating-convergence.py
