name: TEO UAT Verify Diagnostic

on:
  push:
    branches:
      - lemnaru-karol/teo-private-minimal-dev
    paths:
      - ".github/workflows/teo-uat-verify-diagnostic.yml"
      - "commercial/app/teo_app.py"
      - "commercial/teo-worker/**"
      - "commercial/teo-router/**"
      - "scripts/prepare-teo-cloudflare-worker.mjs"
      - "scripts/soak-teo-production.mjs"

concurrency:
  group: teo-uat-verify-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_STAGING_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: lacurent-dev-db
      HOME_LAB_BASE_URL: https://lacurent-uat.lemnarukarol.workers.dev

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install tools
        run: |
          python -m pip install --upgrade uv
          npm install --no-save wrangler@latest

      - name: Resolve development D1
        run: |
          npx wrangler d1 list --json > /tmp/d1-list.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw=json.loads(Path("/tmp/d1-list.json").read_text())
          rows=raw if isinstance(raw,list) else (raw.get("result") or raw.get("databases") or raw.get("items") or [])
          match=next((r for r in rows if isinstance(r,dict) and r.get("name")==os.environ["DB_NAME"]),None)
          if not match:
              raise SystemExit("lacurent-dev-db not found")
          dbid=str(match.get("uuid") or match.get("id") or "")
          if not dbid:
              raise SystemExit("development D1 UUID missing")
          with open(os.environ["GITHUB_ENV"],"a") as fh:
              fh.write(f"DB_ID={dbid}\n")
          PY

      - name: Prepare and configure minimal TEO staging bundle
        run: |
          node scripts/prepare-teo-cloudflare-worker.mjs
          node scripts/configure-full-stack-staging.mjs --db-id "$DB_ID"

      - name: Sync TEO Python bundle
        working-directory: .wrangler/teo-worker
        run: |
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force

      - name: Deploy four TEO staging shards
        working-directory: .wrangler/teo-worker
        run: |
          cp wrangler.toml /tmp/teo-template.toml
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          for suffix in a b c d; do
            python - "$suffix" <<'PY'
          from pathlib import Path
          import sys
          suffix=sys.argv[1]
          text=Path("/tmp/teo-template.toml").read_text()
          text=text.replace('name = "lacurent-staging-teo-private"', f'name = "lacurent-staging-teo-shard-{suffix}"')
          Path("wrangler.toml").write_text(text)
          PY
            uvx --from workers-py pywrangler deploy
          done

      - name: Deploy diagnostic TEO router
        working-directory: .wrangler/teo-router
        run: |
          npm install --save-dev wrangler@latest
          npx wrangler deploy

      - name: Probe VERIFY with and without router flow gate
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import urllib.error
          import uuid

          base = "https://lacurent-uat.lemnarukarol.workers.dev"
          form = {
              "project_name":"TEO router diagnostic",
              "locality_id":"@lc2|alba_iulia|III|-18|siruta-smoke|Smoke%20Locality|Alba",
              "locality":"Smoke Locality",
              "heated_floor_area_m2":"120",
              "heated_volume_m3":"324",
              "indoor_design_temperature_c":"21",
              "building_type":"residential_individual",
              "construction_year":"2005",
              "wall_area_m2":"140",
              "wall_u_value":"0.45",
              "roof_area_m2":"70",
              "roof_u_value":"0.25",
              "floor_area_m2":"60",
              "floor_u_value":"0.36",
              "floor_boundary_type":"ground",
              "window_area_m2":"20",
              "window_u_value":"1.4",
              "door_area_m2":"3",
              "door_u_value":"1.7",
              "air_changes_per_hour":"0.5",
              "infiltration_air_changes_per_hour":"0.15",
              "heating_system_type":"condensing_gas_boiler",
              "heating_efficiency":"0.94",
              "heating_carrier":"natural_gas",
              "_optimization_mode":"auto_economic",
          }

          def post_json(path, payload):
              raw=json.dumps(payload).encode()
              req=urllib.request.Request(
                  base+path,
                  data=raw,
                  headers={
                      "content-type":"application/json",
                      "accept":"application/json",
                      "user-agent":"Mozilla/5.0 LaCurent-UAT-Diagnostic/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req,timeout=90) as resp:
                      body=resp.read().decode()
                      return resp.status, dict(resp.headers), json.loads(body)
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode()
                  try: parsed=json.loads(body)
                  except Exception: parsed={"raw":body}
                  return exc.code, dict(exc.headers), parsed

          status, headers, branch = post_json(
              "/api/optimization/home-lab/v3/branch",
              {"form":form,"branchId":"keep-current-heating","batch":[{}]},
          )
          print("BRANCH", status, headers.get("x-lacurent-teo"), headers.get("x-lacurent-teo-shard"), json.dumps(branch)[:1200])
          if status != 200 or not branch.get("candidates"):
              raise SystemExit("branch probe failed")
          candidate=branch["candidates"][0]

          status, headers, direct = post_json(
              "/api/optimization/home-lab/v3/verify",
              {"form":form,"branchId":"keep-current-heating","candidate":candidate},
          )
          print("VERIFY_DIRECT", status, headers.get("x-lacurent-teo"), headers.get("x-lacurent-teo-shard"), json.dumps(direct)[:1800])

          run_id="diag-"+str(uuid.uuid4())
          fs, fh, started=post_json(
              "/api/optimization/home-lab/v4/flow/start",
              {"runId":run_id,"plannedVerifications":1},
          )
          print("FLOW_START", fs, json.dumps(started))
          if fs != 200:
              raise SystemExit("flow start failed")

          gated_form={**form, "_optimizer_run_id":run_id}
          status2, headers2, gated = post_json(
              "/api/optimization/home-lab/v3/verify",
              {"form":gated_form,"runId":run_id,"branchId":"keep-current-heating","candidate":candidate},
          )
          print("VERIFY_GATED", status2, headers2.get("x-lacurent-teo"), headers2.get("x-lacurent-teo-shard"), json.dumps(gated)[:1800])

          if status != 200:
              raise SystemExit("direct VERIFY failed")
          if status2 != 200:
              raise SystemExit("gated VERIFY failed")
          PY
