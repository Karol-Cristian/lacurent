name: Private RBPE Gateway Stress Probe

on:
  push:
    branches:
      - codex/private-rbpe-live-calculation

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install uv

      - name: Prepare private RBPE bundle
        run: node scripts/prepare-reference-cloudflare-worker.mjs

      - name: Install private RBPE dependencies
        working-directory: .wrangler/reference-rbpe-worker
        run: |
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force

      - name: Deploy four private RBPE shards
        run: |
          cp .wrangler/reference-rbpe-worker/wrangler.toml /tmp/reference-template.toml
          cd .wrangler/reference-rbpe-worker
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          for suffix in a b c d; do
            python - "$suffix" "$GITHUB_RUN_ID" <<'PY'
          from pathlib import Path
          import sys
          suffix, run_id = sys.argv[1], sys.argv[2]
          text = Path("/tmp/reference-template.toml").read_text()
          text = text.replace(
              'name = "lacurent-reference-rbpe"',
              f'name = "lacurent-rbpe-gw-{run_id}-{suffix}"',
          )
          Path("wrangler.toml").write_text(text)
          PY
            uvx --from workers-py pywrangler deploy
          done

      - name: Deploy private RBPE router
        run: |
          mkdir -p .wrangler/rbpe-router-probe
          cp commercial/rbpe-router/worker.mjs .wrangler/rbpe-router-probe/worker.mjs
          cp commercial/rbpe-router/wrangler.toml .wrangler/rbpe-router-probe/wrangler.toml
          python - <<'PY'
          from pathlib import Path
          import os
          run_id = os.environ["GITHUB_RUN_ID"]
          p = Path(".wrangler/rbpe-router-probe/wrangler.toml")
          text = p.read_text().replace(
              'name = "lacurent-rbpe-router"',
              f'name = "lacurent-rbpe-router-gw-{run_id}"',
          )
          for suffix in "abcd":
              text = text.replace(
                  f'service = "lacurent-rbpe-shard-{suffix}"',
                  f'service = "lacurent-rbpe-gw-{run_id}-{suffix}"',
              )
          p.write_text(text)
          PY
          cd .wrangler/rbpe-router-probe
          npm install --save-dev wrangler@latest
          npx wrangler deploy

      - name: Deploy calculation gateway probe
        run: |
          mkdir -p .wrangler/calc-gateway-probe
          cp commercial/calc-gateway/worker.mjs .wrangler/calc-gateway-probe/worker.mjs
          cp commercial/calc-gateway/wrangler.toml .wrangler/calc-gateway-probe/wrangler.toml
          python - <<'PY'
          from pathlib import Path
          import os
          run_id = os.environ["GITHUB_RUN_ID"]
          p = Path(".wrangler/calc-gateway-probe/wrangler.toml")
          text = p.read_text()
          text = text.replace(
              'name = "lacurent-home-lab-calc"',
              f'name = "lacurent-home-lab-calc-gw-{run_id}"',
          )
          text = text.replace("workers_dev = false", "workers_dev = true")
          text = text.replace(
              'service = "lacurent-rbpe-router"',
              f'service = "lacurent-rbpe-router-gw-{run_id}"',
          )
          text = text.split("\n[[routes]]", 1)[0].rstrip() + "\n"
          p.write_text(text)
          PY
          cd .wrangler/calc-gateway-probe
          npm install --save-dev wrangler@latest
          npx wrangler deploy

      - name: Wait for calculation gateway
        env:
          PROBE_URL: https://lacurent-home-lab-calc-gw-${{ github.run_id }}.lemnarukarol.workers.dev
        run: |
          stable=0
          for attempt in $(seq 1 120); do
            if curl -fsS "$PROBE_URL/health" >/tmp/gateway-health.json; then
              stable=$((stable + 1))
              cat /tmp/gateway-health.json
              if [ "$stable" -ge 3 ]; then
                sleep 8
                exit 0
              fi
            else
              stable=0
            fi
            sleep 2
          done
          exit 1

      - name: Run 500 live calculation requests
        env:
          PROBE_URL: https://lacurent-home-lab-calc-gw-${{ github.run_id }}.lemnarukarol.workers.dev
        run: |
          node <<'JS'
          const baseUrl = process.env.PROBE_URL;
          const orientations = [
            "south","south_west","west","north_west",
            "north","north_east","east","south_east"
          ];
          const base = {
            project_name:"Gateway RBPE stress",
            locality_id:"@lc2|alba_iulia|III|-18|siruta-stress|Stress%20Locality|Alba",
            locality:"Stress Locality",
            heated_floor_area_m2:"160",
            heated_volume_m3:"432",
            indoor_design_temperature_c:"20",
            building_type:"residential_individual",
            construction_year:"2004",
            wall_area_m2:"168",
            wall_u_value:"0.42",
            roof_area_m2:"92",
            roof_u_value:"0.24",
            floor_area_m2:"80",
            floor_u_value:"0.36",
            floor_boundary_type:"ground",
            ground_exposed_perimeter_m:"36",
            ground_wall_thickness_m:"0.30",
            ground_conductivity_w_mk:"2.0",
            window_area_m2:"24",
            window_u_value:"1.35",
            door_area_m2:"3.2",
            door_u_value:"1.7",
            thermal_bridge_length_m:"42",
            thermal_bridge_psi_w_mk:"0.05",
            air_changes_per_hour:"0.5",
            infiltration_air_changes_per_hour:"0.15",
            heat_recovery_efficiency:"0",
            heating_system_type:"condensing_gas_boiler",
            heating_efficiency:"0.94",
            heating_carrier:"natural_gas",
            dhw_enabled:"on",
            dhw_occupants:"4",
            dhw_litres_per_person_day_at_60c:"50",
            dhw_efficiency:"0.86",
            dhw_carrier:"natural_gas",
            pv_enabled:"on",
            pv_installed_power_kwp:"5",
            pv_tilt_degrees:"30",
            pv_performance_ratio:"0.82"
          };

          let maxMs = 0;
          for (let i = 0; i < 500; i += 1) {
            const orientation = orientations[i % orientations.length];
            const body = new URLSearchParams({...base, pv_orientation:orientation});
            const started = performance.now();
            const response = await fetch(baseUrl + "/api/home-lab-next/calculate", {
              method:"POST",
              headers:{
                "accept":"application/json",
                "content-type":"application/x-www-form-urlencoded"
              },
              body
            });
            const raw = await response.text();
            let payload = null;
            try { payload = JSON.parse(raw); } catch {}
            const elapsed = Math.round(performance.now() - started);
            maxMs = Math.max(maxMs, elapsed);

            if ((i + 1) % 25 === 0 || !response.ok) {
              console.log(JSON.stringify({
                count:i+1,
                status:response.status,
                elapsed_ms:elapsed,
                max_ms:maxMs,
                orientation,
                energy_class:payload?.energy_class ?? null,
                annual_cost_lei:payload?.annual_cost_lei ?? null,
                result_orientation:payload?.renewables?.pv?.orientation ?? null,
                calc_path:response.headers.get("x-lacurent-calc")
              }));
            }

            if (
              !response.ok ||
              payload?.energy_class == null ||
              payload?.annual_cost_lei == null ||
              payload?.renewables?.pv?.orientation !== orientation ||
              response.headers.get("x-lacurent-calc") !== "private-rbpe-sharded"
            ) {
              console.error(raw.slice(0,1800));
              process.exit(1);
            }
            await new Promise(resolve => setTimeout(resolve, 40));
          }

          const health = await fetch(baseUrl + "/health");
          if (!health.ok) process.exit(2);
          console.log(JSON.stringify({
            status:"gateway-stress-complete",
            logical_requests:500,
            max_elapsed_ms:maxMs
          }));
          JS

      - name: Delete probe Workers
        if: always()
        run: |
          cd .wrangler/calc-gateway-probe
          npx wrangler delete --name "lacurent-home-lab-calc-gw-$GITHUB_RUN_ID" --force || true
          cd ../rbpe-router-probe
          npx wrangler delete --name "lacurent-rbpe-router-gw-$GITHUB_RUN_ID" --force || true
          cd ../reference-rbpe-worker
          for suffix in a b c d; do
            npx wrangler delete --name "lacurent-rbpe-gw-$GITHUB_RUN_ID-$suffix" --force || true
          done
