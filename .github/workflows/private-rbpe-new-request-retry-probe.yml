name: Private RBPE Shard Router Probe

on:
  push:
    branches:
      - codex/private-rbpe-live-calculation

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install uv
          python -m pip install -r commercial/requirements.txt

      - name: Build canonical input
        run: |
          python - <<'PY' > /tmp/building.json
          from commercial.app.main import build_input_from_form
          from commercial.app.models import model_to_json
          form = {
              "project_name":"Private RBPE shard stress",
              "locality_id":"@lc2|alba_iulia|III|-18|siruta-stress|Stress%20Locality|Alba",
              "locality":"Stress Locality",
              "heated_floor_area_m2":"160","heated_volume_m3":"432",
              "indoor_design_temperature_c":"20","building_type":"residential_individual",
              "construction_year":"2004","wall_area_m2":"168","wall_u_value":"0.42",
              "roof_area_m2":"92","roof_u_value":"0.24","floor_area_m2":"80",
              "floor_u_value":"0.36","floor_boundary_type":"ground",
              "ground_exposed_perimeter_m":"36","ground_wall_thickness_m":"0.30",
              "ground_conductivity_w_mk":"2.0","window_area_m2":"24",
              "window_u_value":"1.35","door_area_m2":"3.2","door_u_value":"1.7",
              "thermal_bridge_length_m":"42","thermal_bridge_psi_w_mk":"0.05",
              "air_changes_per_hour":"0.5","infiltration_air_changes_per_hour":"0.15",
              "heat_recovery_efficiency":"0","heating_system_type":"condensing_gas_boiler",
              "heating_efficiency":"0.94","heating_carrier":"natural_gas",
              "dhw_enabled":"on","dhw_occupants":"4",
              "dhw_litres_per_person_day_at_60c":"50","dhw_efficiency":"0.86",
              "dhw_carrier":"natural_gas","pv_enabled":"on",
              "pv_installed_power_kwp":"5","pv_orientation":"south",
              "pv_tilt_degrees":"30","pv_performance_ratio":"0.82"
          }
          print(model_to_json(build_input_from_form(form)))
          PY

      - name: Prepare private RBPE bundle
        run: |
          node scripts/prepare-reference-cloudflare-worker.mjs
          cd .wrangler/reference-rbpe-worker
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force

      - name: Deploy four private RBPE shards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path(".wrangler/reference-rbpe-worker/wrangler.toml")
          original=p.read_text()
          Path("/tmp/rbpe-wrangler-template.toml").write_text(original)
          PY
          cd .wrangler/reference-rbpe-worker
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          for suffix in a b c d; do
            python - "$suffix" <<'PY'
          from pathlib import Path
          import sys
          suffix=sys.argv[1]
          template=Path("/tmp/rbpe-wrangler-template.toml").read_text()
          Path("wrangler.toml").write_text(
              template.replace(
                  'name = "lacurent-reference-rbpe"',
                  f'name = "lacurent-rbpe-live-{suffix}-{__import__("os").environ["GITHUB_RUN_ID"]}"',
              )
          )
          PY
            uvx --from workers-py pywrangler deploy
          done

      - name: Deploy private shard router
        run: |
          mkdir -p .wrangler/rbpe-shard-router
          cat > .wrangler/rbpe-shard-router/worker.mjs <<'JS'
          const shardNames = ["RBPE_A","RBPE_B","RBPE_C","RBPE_D"];
          let cursor = 0;
          const disabledUntil = new Map();
          const failureCounts = new Map();

          async function callShard(env, key, payload) {
            const request = new Request("https://rbpe.internal/calculate-home-lab", {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "accept": "application/json"
              },
              body: JSON.stringify({payload})
            });
            const response = await env[key].fetch(request);
            const raw = await response.text();
            if (response.status >= 500) {
              throw new Error("downstream_http_" + response.status);
            }
            return {response, raw};
          }

          export default {
            async fetch(request, env) {
              const payload = await request.text();
              const now = Date.now();
              const start = cursor++ % shardNames.length;
              const attempted = [];
              let lastError = null;

              // First pass respects circuit-breaker cooldown.
              for (let offset = 0; offset < shardNames.length; offset++) {
                const key = shardNames[(start + offset) % shardNames.length];
                if ((disabledUntil.get(key) || 0) > now) continue;
                attempted.push(key);
                try {
                  const {response, raw} = await callShard(env, key, payload);
                  failureCounts.set(key, 0);
                  return new Response(raw, {
                    status: response.status,
                    headers: {
                      "content-type": response.headers.get("content-type") || "application/json",
                      "cache-control": "no-store",
                      "x-rbpe-shard": key
                    }
                  });
                } catch (error) {
                  lastError = error;
                  const failures = (failureCounts.get(key) || 0) + 1;
                  failureCounts.set(key, failures);
                  disabledUntil.set(key, Date.now() + 5000);
                }
              }

              // Recovery pass: after all immediately healthy shards failed,
              // wait briefly for the earliest breaker(s) to reopen. A downstream
              // 1102 kills that Python invocation; giving Cloudflare a few
              // seconds lets a fresh isolate serve the next attempt without
              // surfacing the transient failure to Home Lab.
              const recoveryDeadline = Date.now() + 8000;
              const recoveryOrder = [...shardNames].sort(
                (a,b) => (disabledUntil.get(a)||0) - (disabledUntil.get(b)||0)
              );
              for (const key of recoveryOrder) {
                const waitMs = Math.max(0, (disabledUntil.get(key)||0) - Date.now());
                if (Date.now() + waitMs > recoveryDeadline) break;
                if (waitMs > 0) {
                  await new Promise(resolve => setTimeout(resolve, waitMs));
                }
                try {
                  const {response, raw} = await callShard(env, key, payload);
                  disabledUntil.delete(key);
                  failureCounts.set(key, 0);
                  return new Response(raw, {
                    status: response.status,
                    headers: {
                      "content-type": response.headers.get("content-type") || "application/json",
                      "cache-control": "no-store",
                      "x-rbpe-shard": key,
                      "x-rbpe-recovered": "1"
                    }
                  });
                } catch (error) {
                  lastError = error;
                  disabledUntil.set(key, Date.now() + 5000);
                }
              }

              return Response.json({
                error:"private_rbpe_all_shards_unavailable",
                attempted,
                errorType:lastError?.name || "Error",
                detail:String(lastError?.message || lastError || "")
              }, {status:503, headers:{"cache-control":"no-store"}});
            }
          };
          JS

          cat > .wrangler/rbpe-shard-router/wrangler.toml <<TOML
          name = "lacurent-rbpe-router-${GITHUB_RUN_ID}"
          main = "worker.mjs"
          compatibility_date = "2026-09-27"
          workers_dev = true

          [[services]]
          binding = "RBPE_A"
          service = "lacurent-rbpe-live-a-${GITHUB_RUN_ID}"
          remote = true

          [[services]]
          binding = "RBPE_B"
          service = "lacurent-rbpe-live-b-${GITHUB_RUN_ID}"
          remote = true

          [[services]]
          binding = "RBPE_C"
          service = "lacurent-rbpe-live-c-${GITHUB_RUN_ID}"
          remote = true

          [[services]]
          binding = "RBPE_D"
          service = "lacurent-rbpe-live-d-${GITHUB_RUN_ID}"
          remote = true
          TOML

          cd .wrangler/rbpe-shard-router
          npm install --save-dev wrangler@latest
          npx wrangler deploy

      - name: Wait for router
        run: |
          for attempt in $(seq 1 90); do
            code="$(curl -sS -o /tmp/router-result.json -w '%{http_code}' -X POST \
              --data-binary @/tmp/building.json \
              https://lacurent-rbpe-router-${GITHUB_RUN_ID}.lemnarukarol.workers.dev/ || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/router-result.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/router-result.json || true
          exit 1

      - name: Run 500 serial calculations through sharded router
        env:
          ROUTER_URL: https://lacurent-rbpe-router-${{ github.run_id }}.lemnarukarol.workers.dev/
        run: |
          node <<'JS'
          const fs = await import("node:fs");
          const payload = fs.readFileSync("/tmp/building.json","utf8").trim();
          const url = process.env.ROUTER_URL;
          const counts = {};
          let recovered = 0;
          let maxMs = 0;

          for (let i=0;i<500;i++) {
            const started=performance.now();
            const response=await fetch(url,{method:"POST",body:payload});
            const raw=await response.text();
            let body=null;
            try { body=JSON.parse(raw); } catch {}
            const elapsed=Math.round(performance.now()-started);
            maxMs=Math.max(maxMs, elapsed);
            const shard=response.headers.get("x-rbpe-shard") || "none";
            counts[shard]=(counts[shard]||0)+1;
            if (response.headers.get("x-rbpe-recovered") === "1") recovered += 1;

            if ((i+1) % 25 === 0 || !response.ok) {
              console.log(JSON.stringify({
                count:i+1,status:response.status,elapsed_ms:elapsed,
                shard,recovered,counts,
                energy_class:body?.energy_class ?? null,
                final_energy_kwh:body?.total_final_energy_kwh ?? null
              }));
            }
            if (!response.ok || !body?.energy_class || body?.total_final_energy_kwh == null) {
              console.error(raw.slice(0,1500));
              process.exit(1);
            }
            await new Promise(resolve => setTimeout(resolve, 350));
          }

          console.log(JSON.stringify({
            status:"stress-complete",
            logical_requests:500,
            counts,
            recovered,
            max_elapsed_ms:maxMs
          }));
          JS

      - name: Delete probes
        if: always()
        run: |
          cd .wrangler/rbpe-shard-router
          npx wrangler delete --name "lacurent-rbpe-router-${GITHUB_RUN_ID}" --force || true
          cd ../reference-rbpe-worker
          for suffix in a b c d; do
            npx wrangler delete --name "lacurent-rbpe-live-$suffix-${GITHUB_RUN_ID}" --force || true
          done
