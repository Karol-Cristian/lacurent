name: Private RBPE End-to-End Probe

on:
  push:
    branches:
      - codex/private-rbpe-live-calculation

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install uv

      - name: Deploy unique private RBPE Worker
        run: |
          node scripts/prepare-reference-cloudflare-worker.mjs
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path(".wrangler/reference-rbpe-worker/wrangler.toml")
          p.write_text(
              p.read_text().replace(
                  'name = "lacurent-reference-rbpe"',
                  f'name = "lacurent-rbpe-e2e-{os.environ["GITHUB_RUN_ID"]}"',
              )
          )
          PY
          cd .wrangler/reference-rbpe-worker
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force
          uvx --from workers-py pywrangler deploy

      - name: Deploy unique web Worker bound to private RBPE
        run: |
          node scripts/prepare-commercial-cloudflare-worker.mjs \
            --name "lacurent-commercial-rbpe-e2e-${GITHUB_RUN_ID}"
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path(".wrangler/commercial-v2-worker/wrangler.toml")
          text=p.read_text().replace(
              'service = "lacurent-reference-rbpe"',
              f'service = "lacurent-rbpe-e2e-{os.environ["GITHUB_RUN_ID"]}"',
          )
          # Probe is workers.dev-only; remove only route blocks while preserving
          # the Text module rules needed by FastAPI StaticFiles/Jinja.
          lines=text.splitlines()
          out=[]
          skipping_route=False
          for line in lines:
              stripped=line.strip()
              if stripped == "[[routes]]":
                  skipping_route=True
                  continue
              if skipping_route and stripped.startswith("[["):
                  skipping_route=False
              if not skipping_route:
                  out.append(line)
          text="\n".join(out).rstrip()+"\n"
          p.write_text(text)
          print(text)
          PY
          cd .wrangler/commercial-v2-worker
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force
          uvx --from workers-py pywrangler deploy

      - name: Wait for web Worker
        run: |
          url="https://lacurent-commercial-rbpe-e2e-${GITHUB_RUN_ID}.lemnarukarol.workers.dev"
          for attempt in $(seq 1 90); do
            if curl -fsS "$url/health"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run 500 end-to-end live Home Lab recalculations
        env:
          PROBE_URL: https://lacurent-commercial-rbpe-e2e-${{ github.run_id }}.lemnarukarol.workers.dev
        run: |
          node <<'JS'
          const baseUrl=process.env.PROBE_URL;
          const orientations=["south","south_west","west","north_west","north","north_east","east","south_east"];
          const base={
            project_name:"Private RBPE e2e stress",
            locality_id:"@lc2|alba_iulia|III|-18|siruta-stress|Stress%20Locality|Alba",
            locality:"Stress Locality",
            heated_floor_area_m2:"160",
            heated_volume_m3:"432",
            indoor_design_temperature_c:"20",
            building_type:"residential_individual",
            construction_year:"2004",
            wall_area_m2:"168",
            wall_u_value:"0.42",
            roof_area_m2:"92",
            roof_u_value:"0.24",
            floor_area_m2:"80",
            floor_u_value:"0.36",
            floor_boundary_type:"ground",
            ground_exposed_perimeter_m:"36",
            ground_wall_thickness_m:"0.30",
            ground_conductivity_w_mk:"2.0",
            window_area_m2:"24",
            window_u_value:"1.35",
            door_area_m2:"3.2",
            door_u_value:"1.7",
            thermal_bridge_length_m:"42",
            thermal_bridge_psi_w_mk:"0.05",
            air_changes_per_hour:"0.5",
            infiltration_air_changes_per_hour:"0.15",
            heat_recovery_efficiency:"0",
            heating_system_type:"condensing_gas_boiler",
            heating_efficiency:"0.94",
            heating_carrier:"natural_gas",
            dhw_enabled:"on",
            dhw_occupants:"4",
            dhw_litres_per_person_day_at_60c:"50",
            dhw_efficiency:"0.86",
            dhw_carrier:"natural_gas",
            pv_enabled:"on",
            pv_installed_power_kwp:"5",
            pv_tilt_degrees:"30",
            pv_performance_ratio:"0.82"
          };
          let maxMs=0;
          for(let i=0;i<500;i++){
            const orientation=orientations[i%orientations.length];
            const form=new URLSearchParams({...base,pv_orientation:orientation});
            const started=performance.now();
            const response=await fetch(baseUrl+"/api/home-lab-next/calculate",{
              method:"POST",
              headers:{"accept":"application/json","content-type":"application/x-www-form-urlencoded"},
              body:form
            });
            const raw=await response.text();
            let body=null;
            try{body=JSON.parse(raw);}catch{}
            const elapsed=Math.round(performance.now()-started);
            maxMs=Math.max(maxMs,elapsed);
            if((i+1)%25===0 || !response.ok){
              console.log(JSON.stringify({
                count:i+1,status:response.status,elapsed_ms:elapsed,max_ms:maxMs,
                orientation,
                energy_class:body?.energy_class??null,
                annual_cost_lei:body?.annual_cost_lei??null,
                result_orientation:body?.renewables?.pv?.orientation??null
              }));
            }
            if(
              !response.ok ||
              !body?.energy_class ||
              body?.annual_cost_lei==null ||
              body?.renewables?.pv?.orientation!==orientation
            ){
              console.error(raw.slice(0,1500));
              process.exit(1);
            }
            await new Promise(resolve=>setTimeout(resolve,350));
          }

          for(const path of ["/health","/home-lab-next"]){
            const response=await fetch(baseUrl+path,{headers:{"accept":path==="/health"?"application/json":"text/html"}});
            console.log(JSON.stringify({path,status:response.status}));
            if(!response.ok) process.exit(2);
          }
          console.log(JSON.stringify({status:"e2e-stress-complete",logical_requests:500,max_elapsed_ms:maxMs}));
          JS

      - name: Delete probes
        if: always()
        run: |
          cd .wrangler/commercial-v2-worker
          npx wrangler delete --name "lacurent-commercial-rbpe-e2e-${GITHUB_RUN_ID}" --force || true
          cd ../reference-rbpe-worker
          npx wrangler delete --name "lacurent-rbpe-e2e-${GITHUB_RUN_ID}" --force || true
