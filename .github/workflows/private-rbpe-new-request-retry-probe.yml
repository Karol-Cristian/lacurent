name: Private RBPE GC Probe

on:
  push:
    branches:
      - codex/private-rbpe-live-calculation

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install uv
          python -m pip install -r commercial/requirements.txt

      - name: Build canonical input
        run: |
          python - <<'PY' > /tmp/building.json
          from commercial.app.main import build_input_from_form
          from commercial.app.models import model_to_json
          form = {
              "project_name":"Private RBPE GC stress",
              "locality_id":"@lc2|alba_iulia|III|-18|siruta-stress|Stress%20Locality|Alba",
              "locality":"Stress Locality",
              "heated_floor_area_m2":"160","heated_volume_m3":"432",
              "indoor_design_temperature_c":"20","building_type":"residential_individual",
              "construction_year":"2004","wall_area_m2":"168","wall_u_value":"0.42",
              "roof_area_m2":"92","roof_u_value":"0.24","floor_area_m2":"80",
              "floor_u_value":"0.36","floor_boundary_type":"ground",
              "ground_exposed_perimeter_m":"36","ground_wall_thickness_m":"0.30",
              "ground_conductivity_w_mk":"2.0","window_area_m2":"24",
              "window_u_value":"1.35","door_area_m2":"3.2","door_u_value":"1.7",
              "thermal_bridge_length_m":"42","thermal_bridge_psi_w_mk":"0.05",
              "air_changes_per_hour":"0.5","infiltration_air_changes_per_hour":"0.15",
              "heat_recovery_efficiency":"0","heating_system_type":"condensing_gas_boiler",
              "heating_efficiency":"0.94","heating_carrier":"natural_gas",
              "dhw_enabled":"on","dhw_occupants":"4",
              "dhw_litres_per_person_day_at_60c":"50","dhw_efficiency":"0.86",
              "dhw_carrier":"natural_gas","pv_enabled":"on",
              "pv_installed_power_kwp":"5","pv_orientation":"south",
              "pv_tilt_degrees":"30","pv_performance_ratio":"0.82"
          }
          print(model_to_json(build_input_from_form(form)))
          PY

      - name: Deploy one private RBPE probe
        run: |
          node scripts/prepare-reference-cloudflare-worker.mjs
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path(".wrangler/reference-rbpe-worker/wrangler.toml")
          text=p.read_text().replace(
              'name = "lacurent-reference-rbpe"',
              f'name = "lacurent-rbpe-gc-{os.environ["GITHUB_RUN_ID"]}"',
          )
          p.write_text(text)
          PY
          cd .wrangler/reference-rbpe-worker
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force
          uvx --from workers-py pywrangler deploy

      - name: Deploy unique HTTP proxy
        run: |
          mkdir -p .wrangler/rbpe-gc-proxy
          cat > .wrangler/rbpe-gc-proxy/worker.mjs <<'JS'
          export default {
            async fetch(request, env) {
              const payload = await request.text();
              try {
                const inner = new Request("https://rbpe.internal/calculate-home-lab", {
                  method: "POST",
                  headers: {"content-type":"application/json","accept":"application/json"},
                  body: JSON.stringify({payload})
                });
                const response = await env.RBPE.fetch(inner);
                return new Response(response.body, {
                  status: response.status,
                  headers: {
                    "content-type": response.headers.get("content-type") || "application/json",
                    "cache-control":"no-store"
                  }
                });
              } catch (error) {
                return Response.json({
                  error:"private_rbpe_binding_failure",
                  errorType:error?.name || "Error",
                  detail:String(error?.message || error || "")
                }, {status:503});
              }
            }
          };
          JS
          cat > .wrangler/rbpe-gc-proxy/wrangler.toml <<TOML
          name = "lacurent-rbpe-gc-proxy-${GITHUB_RUN_ID}"
          main = "worker.mjs"
          compatibility_date = "2026-09-27"
          workers_dev = true

          [[services]]
          binding = "RBPE"
          service = "lacurent-rbpe-gc-${GITHUB_RUN_ID}"
          remote = true
          TOML
          cd .wrangler/rbpe-gc-proxy
          npm install --save-dev wrangler@latest
          npx wrangler deploy

      - name: Wait for probe
        run: |
          url="https://lacurent-rbpe-gc-proxy-${GITHUB_RUN_ID}.lemnarukarol.workers.dev/"
          for attempt in $(seq 1 90); do
            code="$(curl -sS -o /tmp/result.json -w '%{http_code}' -X POST --data-binary @/tmp/building.json "$url" || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/result.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/result.json || true
          exit 1

      - name: Run 500 serial calculations on one private isolate service
        env:
          PROBE_URL: https://lacurent-rbpe-gc-proxy-${{ github.run_id }}.lemnarukarol.workers.dev/
        run: |
          node <<'JS'
          const fs = await import("node:fs");
          const payload = fs.readFileSync("/tmp/building.json","utf8").trim();
          const url = process.env.PROBE_URL;
          let maxMs=0;
          for (let i=0;i<500;i++) {
            const started=performance.now();
            const response=await fetch(url,{method:"POST",body:payload});
            const raw=await response.text();
            let body=null;
            try { body=JSON.parse(raw); } catch {}
            const elapsed=Math.round(performance.now()-started);
            maxMs=Math.max(maxMs,elapsed);
            if ((i+1)%25===0 || !response.ok) {
              console.log(JSON.stringify({
                count:i+1,status:response.status,elapsed_ms:elapsed,max_ms:maxMs,
                energy_class:body?.energy_class ?? null,
                final_energy_kwh:body?.total_final_energy_kwh ?? null
              }));
            }
            if (!response.ok || !body?.energy_class || body?.total_final_energy_kwh == null) {
              console.error(raw.slice(0,1500));
              process.exit(1);
            }
            await new Promise(resolve=>setTimeout(resolve,350));
          }
          console.log(JSON.stringify({status:"stress-complete",logical_requests:500,max_elapsed_ms:maxMs}));
          JS

      - name: Query probe metrics
        if: always()
        run: |
          sleep 8
          python - <<'PY' > /tmp/query.json
          import json, os
          from datetime import datetime, timezone, timedelta
          now=datetime.now(timezone.utc)
          print(json.dumps({
            "query": """query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string) {
              viewer { accounts(filter: {accountTag: $accountTag}) {
                workersInvocationsAdaptive(limit: 1000, filter: {
                  datetime_geq: $datetimeStart, datetime_leq: $datetimeEnd
                }) {
                  sum { requests errors }
                  quantiles { cpuTimeP50 cpuTimeP99 memoryUsageBytesP50 memoryUsageBytesP99 }
                  dimensions { datetime scriptName status }
                }
              } }
            }""",
            "variables":{
              "accountTag":os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "datetimeStart":(now-timedelta(minutes=12)).isoformat(timespec="milliseconds").replace("+00:00","Z"),
              "datetimeEnd":now.isoformat(timespec="milliseconds").replace("+00:00","Z")
            }
          }))
          PY
          curl --fail-with-body --silent https://api.cloudflare.com/client/v4/graphql \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data @/tmp/query.json | jq --arg run "$GITHUB_RUN_ID" \
            '.data.viewer.accounts[0].workersInvocationsAdaptive
             | map(select(.dimensions.scriptName == ("lacurent-rbpe-gc-" + $run)))'

      - name: Delete probes
        if: always()
        run: |
          cd .wrangler/rbpe-gc-proxy
          npx wrangler delete --name "lacurent-rbpe-gc-proxy-${GITHUB_RUN_ID}" --force || true
          cd ../reference-rbpe-worker
          npx wrangler delete --name "lacurent-rbpe-gc-${GITHUB_RUN_ID}" --force || true
