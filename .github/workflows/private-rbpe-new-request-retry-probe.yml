name: Private RBPE HTTP Binding Probe

on:
  push:
    branches:
      - codex/private-rbpe-live-calculation

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install uv
          python -m pip install -r commercial/requirements.txt

      - name: Build canonical input
        run: |
          python - <<'PY' > /tmp/building.json
          from commercial.app.main import build_input_from_form
          from commercial.app.models import model_to_json
          form = {
              "project_name":"HTTP binding stress",
              "locality_id":"@lc2|alba_iulia|III|-18|siruta-stress|Stress%20Locality|Alba",
              "locality":"Stress Locality",
              "heated_floor_area_m2":"160","heated_volume_m3":"432",
              "indoor_design_temperature_c":"20","building_type":"residential_individual",
              "construction_year":"2004","wall_area_m2":"168","wall_u_value":"0.42",
              "roof_area_m2":"92","roof_u_value":"0.24","floor_area_m2":"80",
              "floor_u_value":"0.36","floor_boundary_type":"ground",
              "ground_exposed_perimeter_m":"36","ground_wall_thickness_m":"0.30",
              "ground_conductivity_w_mk":"2.0","window_area_m2":"24",
              "window_u_value":"1.35","door_area_m2":"3.2","door_u_value":"1.7",
              "thermal_bridge_length_m":"42","thermal_bridge_psi_w_mk":"0.05",
              "air_changes_per_hour":"0.5","infiltration_air_changes_per_hour":"0.15",
              "heat_recovery_efficiency":"0","heating_system_type":"condensing_gas_boiler",
              "heating_efficiency":"0.94","heating_carrier":"natural_gas",
              "dhw_enabled":"on","dhw_occupants":"4",
              "dhw_litres_per_person_day_at_60c":"50","dhw_efficiency":"0.86",
              "dhw_carrier":"natural_gas","pv_enabled":"on",
              "pv_installed_power_kwp":"5","pv_orientation":"south",
              "pv_tilt_degrees":"30","pv_performance_ratio":"0.82"
          }
          print(model_to_json(build_input_from_form(form)))
          PY

      - name: Deploy private RBPE
        run: |
          node scripts/prepare-reference-cloudflare-worker.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path(".wrangler/reference-rbpe-worker/wrangler.toml")
          p.write_text(p.read_text().replace(
              'name = "lacurent-reference-rbpe"',
              'name = "lacurent-rbpe-http-probe"',
          ))
          PY
          cd .wrangler/reference-rbpe-worker
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force
          uvx --from workers-py pywrangler deploy
          sleep 15

      - name: Deploy JavaScript HTTP-binding proxy
        run: |
          mkdir -p .wrangler/rbpe-http-proxy
          cat > .wrangler/rbpe-http-proxy/worker.mjs <<'JS'
          export default {
            async fetch(request, env) {
              const payload = await request.text();
              try {
                const inner = new Request("https://rbpe.internal/calculate-home-lab", {
                  method: "POST",
                  headers: {"content-type":"application/json","accept":"application/json"},
                  body: JSON.stringify({payload})
                });
                const response = await env.RBPE.fetch(inner);
                return new Response(response.body, {
                  status: response.status,
                  headers: response.headers
                });
              } catch (error) {
                return Response.json(
                  {error:"private_rbpe_binding_failure", errorType:error?.name || "Error"},
                  {status:503}
                );
              }
            }
          };
          JS
          cat > .wrangler/rbpe-http-proxy/wrangler.toml <<'TOML'
          name = "lacurent-rbpe-http-proxy"
          main = "worker.mjs"
          compatibility_date = "2026-09-27"
          workers_dev = true

          [[services]]
          binding = "RBPE"
          service = "lacurent-rbpe-http-probe"
          remote = true
          TOML
          cd .wrangler/rbpe-http-proxy
          npm install --save-dev wrangler@latest
          npx wrangler deploy
          sleep 15

      - name: Wait for healthy binding
        run: |
          for attempt in $(seq 1 90); do
            code="$(curl -sS -o /tmp/result.json -w '%{http_code}' -X POST \
              --data-binary @/tmp/building.json \
              https://lacurent-rbpe-http-proxy.lemnarukarol.workers.dev/ || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/result.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/result.json || true
          exit 1

      - name: Run 240 serial calculations through HTTP binding
        run: |
          node <<'JS'
          const fs = await import("node:fs");
          const payload = fs.readFileSync("/tmp/building.json","utf8").trim();
          const url = "https://lacurent-rbpe-http-proxy.lemnarukarol.workers.dev/";
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let recoveries = 0;

          async function once() {
            const response = await fetch(url,{method:"POST",body:payload});
            const raw = await response.text();
            let body=null;
            try { body=JSON.parse(raw); } catch {}
            return {response,raw,body};
          }

          for (let i=0;i<240;i++) {
            const started=performance.now();
            let attempt=1;
            let current=await once();
            if (current.response.status >= 500) {
              recoveries += 1;
              attempt=2;
              await sleep(750);
              current=await once();
            }
            console.log(JSON.stringify({
              count:i+1,status:current.response.status,attempt,
              elapsed_ms:Math.round(performance.now()-started),
              energy_class:current.body?.energy_class ?? null,
              final_energy_kwh:current.body?.total_final_energy_kwh ?? null
            }));
            if (!current.response.ok || !current.body?.energy_class || current.body?.total_final_energy_kwh == null) {
              console.error(current.raw.slice(0,1500));
              process.exit(1);
            }
            await sleep(75);
          }
          console.log(JSON.stringify({status:"stress-complete",logical_requests:240,recoveries}));
          JS

      - name: Delete probes
        if: always()
        run: |
          cd .wrangler/rbpe-http-proxy
          npx wrangler delete --name lacurent-rbpe-http-proxy --force || true
          cd ../reference-rbpe-worker
          npx wrangler delete --name lacurent-rbpe-http-probe --force || true
