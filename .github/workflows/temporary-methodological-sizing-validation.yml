name: Temporary methodological sizing validation

on:
  push:
    branches:
      - codex/methodological-sizing-d1-catalog

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial/requirements.txt
      - name: Validate
        run: |
          git diff --check
          python -m compileall -q commercial
          python -m pytest commercial/tests -q
