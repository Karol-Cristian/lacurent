name: Heating sizing V3 production diagnostic
on:
  push:
    branches:
      - diagnostic/heating-sizing-v3-production
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe-heating-sizing-v3.py
