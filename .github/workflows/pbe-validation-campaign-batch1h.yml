name: PBE Validation Campaign Batch 1h

on:
  push:
    branches:
      - analysis/pbe-vertical-validation-20260920
    paths:
      - validation/pbe_campaign_batch1h_full_climate_normalized.py
      - .github/workflows/pbe-validation-campaign-batch1h.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-climate-normalized:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial/requirements.txt
          python -m pip install "git+https://github.com/EURAC-EEBgroup/pyBuildingEnergy.git@32ff8648312fc4cd0ac4e963464ee956a7c47d2d"
      - name: Run full climate-normalized matrix
        env:
          VALIDATION_OUT: validation-campaign-results-1h
          MPLBACKEND: Agg
          PYTHONPATH: .
        run: python validation/pbe_campaign_batch1h_full_climate_normalized.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbe-validation-campaign-batch1h
          path: validation-campaign-results-1h/
          if-no-files-found: warn
