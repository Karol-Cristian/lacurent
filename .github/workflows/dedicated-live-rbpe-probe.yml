name: Dedicated Live RBPE Probe

on:
  push:
    branches:
      - codex/dedicated-live-rbpe-worker

concurrency:
  group: dedicated-live-rbpe-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: python -m pip install uv "pydantic<2"

      - name: Prepare isolated live RBPE Worker
        run: |
          node scripts/prepare-reference-cloudflare-worker.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path(".wrangler/reference-rbpe-worker/wrangler.toml")
          text = p.read_text()
          text = text.replace('name = "lacurent-reference-rbpe"', 'name = "lacurent-live-rbpe-probe"')
          text = text.replace("workers_dev = false", "workers_dev = true")
          p.write_text(text)
          PY

      - name: Install Wrangler and sync
        working-directory: .wrangler/reference-rbpe-worker
        run: |
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force

      - name: Deploy probe
        working-directory: .wrangler/reference-rbpe-worker
        run: |
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler deploy

      - name: Wait for health
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS https://lacurent-live-rbpe-probe.lemnarukarol.workers.dev/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Prepare and deploy JS RPC caller
        run: |
          mkdir -p /tmp/rbpe-rpc-caller/src
          cat > /tmp/rbpe-rpc-caller/wrangler.toml <<'TOML'
          name = "lacurent-rbpe-rpc-caller"
          main = "src/index.js"
          compatibility_date = "2026-09-27"
          workers_dev = true

          [[services]]
          binding = "RBPE"
          service = "lacurent-live-rbpe-probe"
          remote = true
          TOML
          cat > /tmp/rbpe-rpc-caller/src/index.js <<'JS'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname === "/health") {
                return Response.json({status:"ok"});
              }
              if (request.method !== "POST" || url.pathname !== "/calculate") {
                return new Response("Not found", {status:404});
              }
              try {
                const body = await request.json();
                const result = await env.RBPE.live_calculation(
                  JSON.stringify(body.payload),
                  Boolean(body.details)
                );
                return Response.json(result);
              } catch (error) {
                return Response.json(
                  {error:String(error?.stack || error)},
                  {status:500}
                );
              }
            }
          };
          JS
          cd /tmp/rbpe-rpc-caller
          npx wrangler@latest deploy

      - name: Wait for RPC caller health
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS https://lacurent-rbpe-rpc-caller.lemnarukarol.workers.dev/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Generate canonical building payload
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "commercial")
          from app.engine import demo_building
          from app.models import model_to_dict
          with open("/tmp/rbpe-building.json", "w", encoding="utf-8") as f:
              json.dump(model_to_dict(demo_building()), f)
          PY

      - name: Stress compact live RBPE 1000 times
        env:
          RBPE_BASE_URL: https://lacurent-rbpe-rpc-caller.lemnarukarol.workers.dev
          RBPE_BUILDING_FILE: /tmp/rbpe-building.json
          RBPE_CYCLES: "125"
          RBPE_DELAY_MS: "10"
          RBPE_DETAILS: "false"
          RBPE_PATH: /calculate
        run: node scripts/stress-dedicated-live-rbpe.mjs

      - name: Verify full details remain available
        env:
          RBPE_BASE_URL: https://lacurent-rbpe-rpc-caller.lemnarukarol.workers.dev
          RBPE_BUILDING_FILE: /tmp/rbpe-building.json
          RBPE_CYCLES: "1"
          RBPE_DELAY_MS: "50"
          RBPE_DETAILS: "true"
          RBPE_PATH: /calculate
        run: node scripts/stress-dedicated-live-rbpe.mjs

      - name: Query probe memory after stress
        shell: bash
        run: |
          sleep 8
          python - <<'PY' > /tmp/query.json
          import json, os
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          print(json.dumps({
            "query": "query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string, $scriptName: string) { viewer { accounts(filter: {accountTag: $accountTag}) { workersInvocationsAdaptive(limit: 200, filter: {scriptName: $scriptName, datetime_geq: $datetimeStart, datetime_leq: $datetimeEnd}) { sum { requests errors } quantiles { cpuTimeP50 cpuTimeP99 memoryUsageBytesP50 memoryUsageBytesP99 } dimensions { datetime scriptName status } } } } }",
            "variables": {
              "accountTag": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "datetimeStart": (now-timedelta(minutes=15)).isoformat(timespec="milliseconds").replace("+00:00","Z"),
              "datetimeEnd": now.isoformat(timespec="milliseconds").replace("+00:00","Z"),
              "scriptName": "lacurent-live-rbpe-probe"
            }
          }))
          PY
          curl --fail-with-body --silent             https://api.cloudflare.com/client/v4/graphql             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --header "Content-Type: application/json"             --data @/tmp/query.json | jq .

      - name: Delete RPC caller
        if: always()
        run: |
          cd /tmp/rbpe-rpc-caller 2>/dev/null || exit 0
          npx wrangler@latest delete --name lacurent-rbpe-rpc-caller --force || true

      - name: Delete probe
        if: always()
        working-directory: .wrangler/reference-rbpe-worker
        run: npx wrangler delete --name lacurent-live-rbpe-probe --force || true
