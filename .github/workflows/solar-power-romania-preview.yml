name: Solar Power Romania Preview

on:
  push:
    branches:
      - codex/solar-power-romania-poc
    paths:
      - "workers/solar-power-romania/**"
      - ".github/workflows/solar-power-romania-preview.yml"

concurrency:
  group: solar-power-romania-preview
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://lacurent-solar-romania.lemnarukarol.workers.dev
      R2_BUCKET: lacurent-solar-romania-archive

    steps:
      - name: Check out isolated Solar Power branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate preview credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Unit tests
        run: node --test workers/solar-power-romania/tests/*.test.mjs

      - name: Ensure immutable R2 archive
        run: |
          npx --yes wrangler@4.145.0 r2 bucket create "$R2_BUCKET" >/tmp/r2-create.log 2>&1 || true
          cat /tmp/r2-create.log
          npx --yes wrangler@4.145.0 r2 bucket list | grep -q "$R2_BUCKET"

      - name: Wrangler dry run
        run: npx --yes wrangler@4.145.0 deploy --config workers/solar-power-romania/wrangler.toml --dry-run

      - name: Deploy isolated Worker
        run: npx --yes wrangler@4.145.0 deploy --config workers/solar-power-romania/wrangler.toml

      - name: Smoke test preview
        run: |
          retry() {
            url="$1"
            marker="$2"
            for attempt in $(seq 1 20); do
              body="$(curl -fsSL --max-time 30 "$url" || true)"
              if printf '%s' "$body" | grep -q "$marker"; then
                return 0
              fi
              sleep 5
            done
            echo "::error::Marker '$marker' not available at $url"
            return 1
          }
          retry "$PREVIEW_URL/health" '"version":"0.3.0"'
          retry "$PREVIEW_URL/" '15 MIN'
          retry "$PREVIEW_URL/api/v1/models" '"15-minute forecast grid"'
          retry "$PREVIEW_URL/api/v1/benchmark" '"resolution_minutes":15'
          retry "$PREVIEW_URL/api/v1/pv/forecast?lat=44.4268&lon=26.1025&capacity_mwp=10&tilt=30&azimuth=0" '"grid_minutes":15'

      - name: Publish preview URL
        run: |
          echo "## Solar Power Romania v0.3" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "15-minute issuance + full 48h R2 curve archive + native satellite truth + horizon benchmark." >> "$GITHUB_STEP_SUMMARY"
