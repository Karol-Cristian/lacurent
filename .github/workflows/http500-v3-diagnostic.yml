name: HTTP500 V3 production full-flow diagnostic
on:
  push:
    branches:
      - diagnostic/http500-v3-full-flow
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe-http500-v3-full-flow.py
