name: Commercial PR Checks

on:
  pull_request:
    branches:
      - codex/commercial-v2-cloudflare-python

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial/requirements.txt

      - name: Run Commercial v2 checks
        run: |
          git diff --check
          node --check commercial/static/app.js
          node --check commercial/static/energy-ui.js
          node --check commercial/static/energy-i18n.js
          node --check commercial/static/calculator-submit-fix.js
          node --check commercial/static/scenario-cockpit.js
          node --check commercial/static/home-lab-next.js
          node --check commercial/static/home-lab-editorial.js
          node --check commercial/static/teo-v4-worker.js
          node --check commercial/static/reference-comparison.js
          node --check commercial/static/home-lab-3d.js
          node --check scripts/prepare-reference-cloudflare-worker.mjs
          node scripts/prepare-reference-cloudflare-worker.mjs
          node --test commercial/tests/language-toggle.test.cjs
          node --test commercial/tests/scenario-cockpit.test.cjs
          node --test commercial/tests/request-timeout.test.cjs
          python -m compileall -q commercial
          python -m pytest commercial/tests -q

      - name: Smoke dedicated Reference RBPE Worker
        run: |
          python -m pip install uv
          node scripts/prepare-reference-cloudflare-worker.mjs
          cd .wrangler/reference-rbpe-worker
          npm install --save-dev wrangler@latest
          mkdir -p .bin
          printf '#!/usr/bin/env bash\nexec npx wrangler "$@"\n' > .bin/wrangler
          chmod +x .bin/wrangler
          export PATH="$PWD/.bin:$PWD/node_modules/.bin:$PATH"
          uvx --from workers-py pywrangler sync --force
          uvx --from workers-py pywrangler dev --ip 127.0.0.1 --port 8791 > reference-worker-dev.log 2>&1 &
          worker_pid=$!
          trap 'kill $worker_pid || true; cat reference-worker-dev.log || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8791/health; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat reference-worker-dev.log
              exit 1
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          sys.path.insert(0, "src")
          from app.engine import calculate, demo_building
          from app.models import model_to_json

          building = demo_building()
          actual = calculate(
              building,
              include_reference=False,
          ).primary_energy.specific_kwh_m2
          body = json.dumps({
              "payload": model_to_json(building),
              "actualSpecificPrimaryKwhM2": actual,
          }).encode("utf-8")
          request = urllib.request.Request(
              "http://127.0.0.1:8791/reference-comparison",
              data=body,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  response_body = response.read().decode("utf-8")
                  payload = json.loads(response_body)
                  if response.status != 200:
                      raise AssertionError(
                          f"HTTP {response.status}: {response_body}"
                      )
          except urllib.error.HTTPError as error:
              response_body = error.read().decode("utf-8", errors="replace")
              raise AssertionError(
                  f"Reference Worker HTTP {error.code}: {response_body}"
              ) from error

          if payload.get("calculationMode") != "dedicated_reference_rbpe_worker":
              raise AssertionError(payload)
          if float(payload.get("referenceSpecificPrimaryKwhM2") or 0) <= 0:
              raise AssertionError(payload)
          print("Reference RBPE local smoke", payload)
          PY

      - name: Install Chromium smoke dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Home Lab browser smoke
        env:
          HOME_LAB_BASE_URL: http://127.0.0.1:8765
        run: |
          python -m uvicorn app.main:app --app-dir commercial --host 127.0.0.1 --port 8765 > /tmp/home-lab-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/home-lab-uvicorn.log || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS "$HOME_LAB_BASE_URL/health" | grep -q '"status":"ok"'; then
              break
            fi
            sleep 1
          done
          curl -fsS "$HOME_LAB_BASE_URL/health" | grep -q '"status":"ok"'
          node scripts/smoke-home-lab-browser.mjs
