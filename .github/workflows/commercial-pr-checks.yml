name: Commercial PR Checks

on:
  pull_request:
    branches:
      - codex/commercial-v2-cloudflare-python

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial/requirements.txt

      - name: Run Commercial v2 checks
        run: |
          git diff --check
          node --check commercial/static/app.js
          node --check commercial/static/energy-ui.js
          node --check commercial/static/energy-i18n.js
          node --check commercial/static/calculator-submit-fix.js
          node --check commercial/static/scenario-cockpit.js
          node --check commercial/static/home-lab-next.js
          node --check commercial/static/home-lab-editorial.js
          node --check commercial/static/teo-v4-worker.js
          node --check commercial/static/home-lab-3d.js
          node --test commercial/tests/language-toggle.test.cjs
          node --test commercial/tests/scenario-cockpit.test.cjs
          node --test commercial/tests/request-timeout.test.cjs
          python -m compileall -q commercial
          python -m pytest commercial/tests -q

      - name: Install Chromium smoke dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Home Lab browser smoke
        env:
          HOME_LAB_BASE_URL: http://127.0.0.1:8765
        run: |
          python -m uvicorn app.main:app --app-dir commercial --host 127.0.0.1 --port 8765 > /tmp/home-lab-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/home-lab-uvicorn.log || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS "$HOME_LAB_BASE_URL/health" | grep -q '"status":"ok"'; then
              break
            fi
            sleep 1
          done
          curl -fsS "$HOME_LAB_BASE_URL/health" | grep -q '"status":"ok"'
          node scripts/smoke-home-lab-browser.mjs
