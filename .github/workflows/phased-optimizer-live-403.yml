name: Phased optimizer 403 production diagnostic
on:
  push:
    branches:
      - diagnostic/phased-optimizer-live-403
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe-phased-optimizer-live-403.py
