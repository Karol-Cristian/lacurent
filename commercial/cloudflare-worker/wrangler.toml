name = "lacurent-commercial-v2"
main = "src/worker.py"
compatibility_date = "2026-08-29"
compatibility_flags = ["python_workers"]
workers_dev = true

# The Python/FastAPI runtime and Home Lab calculations can exceed the default
# Standard Worker CPU ceiling during cold starts and engineering calculations.
# Keep the algorithm itself bounded, but give each request explicit headroom so
# Cloudflare does not terminate valid calculations with error 1102.
[limits]
cpu_ms = 120000

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "lacurent-db"
database_id = "91b70c8a-3c11-4fe0-81ed-e3b64a075118"

[[routes]]
pattern = "lacurent.com"
custom_domain = true

[[routes]]
pattern = "www.lacurent.com/*"
zone_name = "lacurent.com"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.js", "**/*.json", "**/*.geojson", "**/*.svg"]
fallthrough = true
