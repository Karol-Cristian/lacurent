name = "lacurent-commercial-v2"
main = "src/worker.py"
compatibility_date = "2026-08-29"
compatibility_flags = ["python_workers"]
workers_dev = true

# Keep Home Lab requests CPU-bounded in application code. Do not configure an
# explicit Worker CPU limit here: Cloudflare Free rejects [limits].cpu_ms at
# deploy time (API error 100328).

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "lacurent-db"
database_id = "91b70c8a-3c11-4fe0-81ed-e3b64a075118"

[[routes]]
pattern = "lacurent.com"
custom_domain = true

[[routes]]
pattern = "www.lacurent.com/*"
zone_name = "lacurent.com"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.js", "**/*.json", "**/*.geojson", "**/*.svg"]
fallthrough = true
