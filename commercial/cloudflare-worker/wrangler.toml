name = "lacurent-commercial-v2"
main = "src/worker.py"
compatibility_date = "2026-08-29"
compatibility_flags = ["python_workers"]
workers_dev = true

[[routes]]
pattern = "lacurent.com"
custom_domain = true

[[routes]]
pattern = "www.lacurent.com/*"
zone_name = "lacurent.com"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.js", "**/*.json", "**/*.geojson"]
fallthrough = true
