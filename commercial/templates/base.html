<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LaCurent{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=3">
  <link rel="shortcut icon" href="/static/favicon.svg?v=3">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v=v2eng3">
  <link rel="stylesheet" href="{{ url_for('static', path='energy-ui.css') }}?v=energy3">
  <link rel="stylesheet" href="{{ url_for('static', path='cost-details.css') }}?v=cost1">
</head>
<body>
  <div class="app-shell">
    <aside class="brand-rail" aria-label="Navigare LaCurent Instalații & Energie">
      <a class="brand-mark" href="/instalatii">
        <span class="brand-symbol">LC</span>
        <span>
          <strong>LaCurent</strong>
          <small>Instalații & Energie</small>
        </span>
      </a>

      <nav class="rail-nav" aria-label="Flux calculator energetic">
        <a href="/instalatii">Instalații & energie</a>
        <a href="/instalatii/calculator#building">Clădire</a>
        <a href="/instalatii/calculator#envelope">Anvelopă</a>
        <a href="/instalatii/calculator#ventilation">Ventilație</a>
        <a href="/instalatii/calculator#systems">Sisteme</a>
        <a href="/demo">Exemplu calculat</a>
      </nav>
    </aside>

    <main class="workspace">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', path='app.js') }}?v=v2eng3"></script>
  <script src="{{ url_for('static', path='energy-ui.js') }}?v=energy3"></script>
  <script src="{{ url_for('static', path='site-language.js') }}?v=lang1"></script>
</body>
</html>
