name = "lacurent-solar-romania"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = true

[observability]
enabled = true

[durable_objects]
bindings = [
  { name = "ARCHIVE", class_name = "ForecastArchive" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ForecastArchive"]

[triggers]
crons = ["7 * * * *"]
